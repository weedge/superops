<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>本地多Agent系统</title>
<link rel="icon" href="data:,">
<!--
  superops 面板：单文件，原生 JS + CSS，不引用任何外部资源，不需要构建。
  它回答三个问题，按这个顺序：现在有没有事要我处理？系统健康吗、做的事对吗？某一件工作从触发到评估到工单的来龙去脉是什么？
  数据全部来自管理 API（superops/app/http.py）；每 5 秒轮询当前页，页面不可见时暂停。路由用 URL hash。
-->
<style>
:root {
  /* 深色运转台：近黑的蓝底，半透明的深色卡片，等宽字写时间和数，橙色只给“等你处理 / 主操作”，各 Agent 各一种霓虹色 */
  color-scheme: dark;
  --bg: #07090e; --surface: #0f131b; --surface2: #141923; --text: #e8ebf1; --muted: #98a1b1; --faint: #5f6878;
  --line: #222a37; --line2: #19202b;
  --accent: #ff6b2c; --accent-soft: rgba(255, 107, 44, .28); --on-accent: #ffffff;
  --accent-bg: rgba(56, 208, 232, .12); --accent-text: #7fdcef; --link: #5ccfe6;
  --warn: #f5b942; --warn-bg: rgba(245, 185, 66, .11); --warn-line: rgba(245, 185, 66, .34);
  --bad: #ff6b6b; --bad-bg: rgba(255, 107, 107, .11); --bad-line: rgba(255, 107, 107, .36);
  --ok: #3ddc97; --ok-bg: rgba(61, 220, 151, .11);
  --plain-bg: #1a2130;
  --c-orange: #ff6b2c; --c-cyan: #38d0e8; --c-green: #3ddc97; --c-purple: #a78bfa; --c-pink: #f472b6; --c-yellow: #f5b942; --c-blue: #60a5fa;
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .012));
  --shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 30px rgba(0, 0, 0, .28);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, .6);
  --radius: 14px; --radius-sm: 9px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); background-image: radial-gradient(1100px 520px at 50% -8%, rgba(255, 107, 44, .09), transparent 62%), radial-gradient(900px 600px at 105% 10%, rgba(56, 208, 232, .07), transparent 60%), radial-gradient(800px 600px at -5% 60%, rgba(167, 139, 250, .05), transparent 60%); background-attachment: fixed; color: var(--text); font: 14px/1.55 var(--sans); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 28px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

/* 外壳：顶部一条导航（品牌 · 标签 · 在岗状态 · 时钟 · 搜索） */
.top { position: sticky; top: 0; z-index: 20; background: rgba(7, 9, 14, .78); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line2); }
.top-row { display: flex; align-items: center; gap: 8px 14px; min-height: 58px; padding-top: 9px; padding-bottom: 9px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); flex: none; }
.brand:hover { text-decoration: none; }
.logo { position: relative; width: 22px; height: 22px; flex: none; }
.logo i { position: absolute; width: 7px; height: 7px; border-radius: 50%; }
.logo i:nth-child(1) { left: 7px; top: 1px; background: var(--c-orange); box-shadow: 0 0 8px var(--c-orange); }
.logo i:nth-child(2) { left: 1px; top: 13px; background: var(--c-cyan); box-shadow: 0 0 8px var(--c-cyan); }
.logo i:nth-child(3) { left: 13px; top: 13px; background: var(--c-green); box-shadow: 0 0 8px var(--c-green); }
.brand-t { display: flex; flex-direction: column; line-height: 1.2; }
.brand-t b { font-size: 13.5px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand-t small { font: 10.5px var(--mono); color: var(--faint); letter-spacing: .12em; text-transform: uppercase; }
.tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid transparent; border-radius: 9px; color: var(--muted); white-space: nowrap; font-size: 13.5px; font-weight: 500; transition: background .12s, color .12s, border-color .12s; }
.tab:hover { color: var(--text); background: rgba(255, 255, 255, .04); text-decoration: none; }
.tab.on { color: #ffd9c7; background: rgba(255, 107, 44, .12); border-color: rgba(255, 107, 44, .38); font-weight: 600; box-shadow: 0 0 18px rgba(255, 107, 44, .12); }
.tab .n { min-width: 18px; padding: 0 5px; border-radius: 5px; background: var(--c-orange); color: #fff; font: 600 11px/18px var(--mono); text-align: center; box-shadow: 0 0 10px rgba(255, 107, 44, .55); }
.tab-gap { flex: none; width: 1px; height: 16px; margin: 0 6px; background: var(--line); }
.spacer { flex: 1 1 0; min-width: 0; }
.status { display: flex; align-items: center; gap: 10px; flex: none; font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.status .sep { width: 1px; height: 14px; background: var(--line); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badges:empty { display: none; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.live b { color: var(--text); font-weight: 600; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 8px var(--ok); animation: pulse 2.4s infinite; }
.live.bad .dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: none; }
.live.wait .dot { background: var(--faint); box-shadow: none; animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61, 220, 151, .55); } 70% { box-shadow: 0 0 0 7px rgba(61, 220, 151, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0); } }
.clock { color: var(--text); letter-spacing: .04em; }
.clock small { color: var(--faint); margin-left: 4px; }
.searchbox { position: relative; flex: 1 1 120px; max-width: 220px; min-width: 112px; }
.searchbox .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
.search { width: 100%; height: 32px; padding: 0 30px 0 32px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, .03); outline: none; font-size: 13px; transition: border-color .12s, box-shadow .12s; }
.search::placeholder { color: var(--faint); }
.searchbox kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; line-height: 16px; pointer-events: none; }
.search:focus + kbd, .search:not(:placeholder-shown) + kbd { display: none; }
.search:focus, textarea:focus, .inp:focus { border-color: rgba(255, 107, 44, .7); box-shadow: 0 0 0 3px var(--accent-soft); }
.help { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--muted); cursor: pointer; flex: none; padding: 0; display: grid; place-items: center; }
.help:hover { color: var(--text); border-color: var(--faint); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#notice:empty { display: none; }
.notice { background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--warn-line); font-size: 13px; padding: 8px 0; }
main.wrap { padding-top: 24px; padding-bottom: 72px; }
@media (prefers-reduced-motion: reduce) { .live .dot, .wire i, .radar::after { animation: none !important; } }

/* 块 */
.sec { margin-bottom: 28px; }
.sec > h2, .sec-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14.5px; font-weight: 650; color: var(--text); margin: 0 2px 10px; letter-spacing: -.005em; }
.sec > h2 .cnt, .fold .cnt { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 6px; background: var(--plain-bg); color: var(--muted); font: 600 12px var(--mono); line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.sec > h2 .more { margin-left: auto; font-weight: 500; font-size: 13px; }
.hint { font-weight: 400; font-size: 12.5px; color: var(--faint); }
.list, .panel { background: var(--glass), rgba(15, 19, 27, .82); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { overflow: hidden; }
.panel { padding: 14px 18px; }
.quiet { padding: 12px 16px; background: var(--glass), rgba(15, 19, 27, .82); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); box-shadow: var(--shadow); }
.empty { padding: 40px 16px; text-align: center; color: var(--faint); }
.empty.small { padding: 14px 16px; text-align: left; }
.row { position: relative; display: flex; gap: 16px; padding: 13px 18px; border-top: 1px solid var(--line2); transition: background .12s; }
.row:first-child { border-top: 0; }
.list > .row:hover, .rows > .row:hover { background: var(--surface2); }
.row.tone-bad::before, .row.tone-warn::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--bad); }
.row.tone-warn::before { background: var(--warn); }
.row-main { flex: 1 1 0; min-width: 0; }
.row-meta { flex: none; max-width: 40%; color: var(--faint); font: 11.5px/1.75 var(--mono); text-align: right; line-height: 1.75; }
.row-head { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
.row-sub { margin-top: 3px; color: var(--muted); font-size: 13px; }
.row-text { margin-top: 3px; white-space: pre-wrap; }
.code { font-family: var(--mono); font-size: 12.5px; font-weight: 650; white-space: nowrap; padding: 1px 7px; border-radius: 6px; background: var(--accent-bg); color: var(--accent-text); }
a.code:hover { text-decoration: none; filter: brightness(.97); }
.thead h1 .code { padding: 2px 9px; }
.title { color: var(--text); font-weight: 600; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.q { color: var(--text); font-weight: 600; }
.went { margin-top: 4px; font-size: 13px; color: var(--muted); }
.went::before { content: "↳ "; color: var(--faint); }
.went.ok { color: var(--ok); } .went.bad { color: var(--bad); } .went.warn { color: var(--warn); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 21px; white-space: nowrap; background: var(--plain-bg); color: var(--muted); vertical-align: 1px; }
.chip.warn, .chip.bad, .chip.ok, .chip.info { font-weight: 600; }
.chip.warn::before, .chip.bad::before, .chip.ok::before, .chip.info::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--accent-bg); color: var(--accent-text); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.line { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.chip.warnline { background: transparent; color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
a.chip:hover { text-decoration: none; filter: brightness(.97); }
.badges .chip { line-height: 24px; padding: 0 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(255, 255, 255, .035); color: var(--text); cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); transition: background .12s, border-color .12s, filter .12s, transform .06s; }
.btn:hover { background: var(--surface2); border-color: color-mix(in srgb, var(--line) 60%, var(--faint)); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .tab:focus-visible, .fchip:focus-visible, .help:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn.primary { background: linear-gradient(180deg, #ff7f45, #f45d1c); border-color: #ff7a3d; color: var(--on-accent); font-weight: 600; box-shadow: 0 0 16px rgba(255, 107, 44, .35), inset 0 1px 0 rgba(255, 255, 255, .2); }
.btn.primary:hover { filter: brightness(1.08); background: linear-gradient(180deg, #ff7f45, #f45d1c); border-color: #ff7a3d; }
.btn.danger { color: var(--bad); border-color: var(--bad-line); }
.btn.danger:hover { background: var(--bad-bg); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
.btn.danger-solid:hover { filter: brightness(1.06); background: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); padding: 0 6px; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-bg); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.form { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface2); }
.form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
textarea, .inp { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); outline: none; transition: border-color .12s, box-shadow .12s; }
textarea { min-height: 70px; resize: vertical; display: block; }
.form .err { color: var(--bad); font-size: 13px; margin-top: 6px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, .03); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .12s, color .12s; }
.fchip:hover { text-decoration: none; color: var(--text); background: var(--surface2); }
.fchip.on { background: rgba(255, 107, 44, .12); border-color: rgba(255, 107, 44, .4); color: #ffd9c7; font-weight: 600; }
.fchip b { font-weight: 600; font-size: 12px; padding: 0 6px; border-radius: 9px; line-height: 18px; background: var(--plain-bg); color: var(--muted); }
.fchip.on b { background: rgba(255, 107, 44, .25); color: #fff; }
.fsep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.stat { position: relative; background: var(--glass), rgba(15, 19, 27, .82); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px 15px; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.stat::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: var(--sc, var(--c-cyan)); box-shadow: 0 0 10px var(--sc, var(--c-cyan)); opacity: .85; }
.stats > .stat:nth-child(6n+2) { --sc: var(--c-orange); } .stats > .stat:nth-child(6n+3) { --sc: var(--c-purple); } .stats > .stat:nth-child(6n+4) { --sc: var(--c-blue); } .stats > .stat:nth-child(6n+5) { --sc: var(--c-green); } .stats > .stat:nth-child(6n) { --sc: var(--c-pink); }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.stat .v { margin-top: 4px; font: 600 28px/1.2 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .v a { color: inherit; }
.stat .v a:hover { color: var(--accent-text); text-decoration: none; }
.stat .d { margin-top: 4px; font-size: 12px; color: var(--muted); }
.stat .d a { color: var(--muted); }
.stat .d a:hover { color: var(--accent-text); }
.stat.hot { background: var(--warn-bg); border-color: var(--warn-line); }
.stat.hot::after { --sc: var(--warn); }
.stat.hot .v { color: var(--warn); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--glass), rgba(15, 19, 27, .82); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); transition: border-color .12s, box-shadow .12s; }
.card:hover { border-color: color-mix(in srgb, var(--line) 50%, var(--accent)); }
.card h3 { font-size: 15px; font-weight: 650; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .nums { display: flex; gap: 6px 20px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--muted); }
.card .nums b { display: block; font: 600 20px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; margin: 0; }
.kv > dt { color: var(--muted); font-size: 13px; }
.kv > dd { margin: 0; min-width: 0; }
details.fold { background: var(--glass), rgba(15, 19, 27, .82); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
details.fold > summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 18px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text); list-style: none; user-select: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; margin-right: 4px; flex: none; }
details.fold[open] > summary::before { transform: rotate(45deg); }
details.fold > summary:hover { background: var(--surface2); }
details.fold > summary .hint { margin-left: 2px; }
details.fold[open] > summary { border-bottom: 1px solid var(--line2); }
details.fold > .body { padding: 14px 18px; }
details.fold > .rows > .row:first-child { border-top: 0; }
details.inline > summary { cursor: pointer; color: var(--accent-text); font-size: 13px; margin-top: 4px; }
details.inline > div { margin-top: 6px; }
.idline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
pre.text { margin: 6px 0 0; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--line2); border-radius: var(--radius-sm); white-space: pre-wrap; font: 13px/1.6 var(--sans); max-height: 340px; overflow: auto; }
pre.text.err { font-family: var(--mono); font-size: 12px; color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }

.crumbs { font-size: 13px; color: var(--faint); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.thead { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.thead h1 { font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
.subline { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
.now { margin-bottom: 16px; padding: 16px 20px; }
.now.warn { border-color: var(--warn-line); background: linear-gradient(180deg, var(--warn-bg), var(--surface) 70%); }
.now.bad { border-color: var(--bad-line); background: linear-gradient(180deg, var(--bad-bg), var(--surface) 70%); }
.now .lead { font-weight: 650; font-size: 15px; }
.cardbox { margin-top: 8px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--line2); font-size: 13px; }
.cardbox > div + div { margin-top: 2px; }
.cardbox ol, .cardbox ul { margin: 4px 0; padding-left: 22px; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 18px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.banner .btn { margin-left: auto; }

.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-edit { width: 100%; min-height: 62vh; font: 12.5px/1.65 var(--mono); resize: vertical; padding: 12px 14px; }
.skill-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
pre.code { margin: 0; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line2); border-radius: var(--radius-sm); font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow: auto; max-height: 70vh; }
.diff { font: 12px/1.6 var(--mono); white-space: pre-wrap; border: 1px solid var(--line2); border-radius: var(--radius-sm); overflow: auto; max-height: 70vh; }
.diff div { padding: 0 12px; }
.diff .add { background: color-mix(in srgb, #30a46c 16%, var(--surface)); }
.diff .del { background: color-mix(in srgb, #e5484d 16%, var(--surface)); text-decoration: line-through; text-decoration-color: color-mix(in srgb, #e5484d 50%, transparent); }
.diff .gap { color: var(--faint, #999); background: var(--surface2); }
.md { max-width: 1100px; line-height: 1.75; font-size: 14px; color: var(--text); }
.md h2, .md h3, .md h4, .md h5 { margin: 26px 0 10px; line-height: 1.35; }
.md h2.md-h1 { font-size: 22px; margin-top: 4px; }
.md h3.md-h2 { font-size: 18px; padding-top: 10px; border-top: 1px solid var(--line2); }
.md h4.md-h3 { font-size: 15px; }
.md h5.md-h4 { font-size: 14px; color: var(--muted); }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li.md-sub { margin-left: 20px; list-style: circle; }
.md code { font-family: var(--mono); font-size: 12.5px; padding: 1px 5px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line2); }
/* 文档里的字符框图是按“一个汉字 = 两个等宽字符”画的：英文用 Menlo（字宽 0.602em），汉字和全角标点换成放大到 1.204em 的苹方，框线才对得齐 */
@font-face { font-family: 'MdCJK2'; src: local('PingFang SC'), local('PingFangSC-Regular'); size-adjust: 120.4%;
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3040-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF, U+201C-201D; }
.md .md-pre { margin: 10px 0 14px; padding: 14px 16px; background: var(--surface2); border: 1px solid var(--line2); border-radius: var(--radius-sm); font: 12.5px/1.5 Menlo, 'MdCJK2', var(--mono); white-space: pre; overflow-x: auto; }
.md .md-table { margin: 10px 0 16px; overflow-x: auto; }
.md .md-table td code, .md .md-table th code { white-space: nowrap; }
.md .md-table td:first-child, .md .md-table th:first-child { min-width: 5.5em; }
.md blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md .md-ref { text-decoration: underline dotted; cursor: help; }
.tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--faint); padding: 10px 14px; background: rgba(255, 255, 255, .025); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-top: 1px solid var(--line2); vertical-align: top; overflow-wrap: break-word; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr:hover { background: var(--surface2); }
.tbl tr:first-child td { border-top: 0; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl td.wide { min-width: 200px; }
.dist { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line2); }
.dist:first-child { border-top: 0; }
.dist-t { color: var(--muted); min-width: 5.5em; font-weight: 500; }
.dist-i { display: inline-flex; align-items: center; gap: 6px; padding: 1px 4px 1px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line2); }
.dist-i b { font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 999px; background: var(--surface); font-size: 12px; }
/* 内容支柱（栏目）各一种颜色：色相和面板的底色 / 文字色按比例混，浅色深色主题都看得清 */
.pl { background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, var(--surface)); color: color-mix(in srgb, var(--c) 72%, var(--text)); }
.pl b { color: var(--text); }
.plchip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; border: 1px solid; font-size: 12.5px; white-space: nowrap; }
.pl-A { --c: #f76b15; } .pl-B { --c: #3e63dd; } .pl-C { --c: #12a594; } .pl-D { --c: #8e4ec6; } .pl-E { --c: #e93d82; } .pl-F { --c: #d4a017; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--plain-bg); }
.seg > * { padding: 3px 14px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg > .on { background: rgba(255, 107, 44, .14); color: #ffd9c7; font-weight: 600; cursor: default; box-shadow: inset 0 0 0 1px rgba(255, 107, 44, .4); }
.seg > a:hover { text-decoration: none; color: var(--text); }
.modes { display: grid; gap: 10px; }
.mode { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--glass), rgba(15, 19, 27, .82); box-shadow: var(--shadow); }
.mode.on { border-color: rgba(255, 107, 44, .55); background: rgba(255, 107, 44, .07); box-shadow: 0 0 22px rgba(255, 107, 44, .14); }
.mode .name { font-family: var(--mono); font-weight: 700; min-width: 66px; }
.mode .desc { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }

#toasts { position: fixed; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 30; padding: 0 16px; }
.toast { pointer-events: auto; max-width: 560px; padding: 10px 16px; border-radius: 10px; background: #1b2230; color: var(--text); border: 1px solid var(--line); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); cursor: pointer; animation: rise .18s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); }
dialog[open] { animation: rise .18s ease-out; }
dialog::backdrop { background: rgba(3, 5, 9, .7); backdrop-filter: blur(2px); }
.dlg { padding: 20px 22px; }
.dlg h3 { font-size: 16px; font-weight: 650; margin-bottom: 10px; }
.dlg-body { font-size: 13.5px; color: var(--muted); line-height: 1.65; }
.dlg-body p + p { margin-top: 8px; }
.dlg-input { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
.dlg-input .inp { margin-top: 5px; height: 36px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.gloss { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13px; }
.gloss dt { font-weight: 600; color: var(--text); white-space: nowrap; }
.gloss dd { margin: 0; color: var(--muted); }

/* 窄屏：标签换到第二行，横向滚动 */
@media (max-width: 1340px) {
  .clock small { display: none; }
  .tabs { order: 5; flex-basis: 100%; margin: 0 -28px; padding: 0 22px 2px; }
  .searchbox { max-width: 260px; }
}
@media (max-width: 900px) {
  .wrap { padding: 0 16px; }
  .tabs { margin: 0 -16px; padding: 0 10px; }
  .status .clock, .status .sep { display: none; }
}
@media (max-width: 640px) {
  .brand-t small, .searchbox kbd { display: none; }
  .searchbox { order: 4; flex: 1 1 100%; }
  .badges .chip { line-height: 21px; padding: 0 8px; }
  .row { flex-direction: column; gap: 4px; padding: 12px 14px; }
  .row-meta { max-width: none; text-align: left; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv > dt { margin-top: 10px; font-size: 12px; }
  .kv > dt:first-child { margin-top: 0; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 12px 14px; }
  .stat .v { font-size: 22px; }
  .mode { flex-wrap: wrap; }
  .mode .desc { flex-basis: 100%; order: 3; }
  .gloss { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .gloss dd { margin-bottom: 8px; }
}

/* 总览：页首 + KPI */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px 28px; align-items: end; margin-bottom: 26px; }
.eyebrow { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.hero h1 { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.live-tag { font: 700 10.5px/18px var(--mono); letter-spacing: .1em; padding: 0 7px; border-radius: 5px; color: #062a1a; background: var(--c-green); box-shadow: 0 0 14px rgba(61, 220, 151, .55); }
.hero p { margin-top: 8px; color: var(--muted); font-size: 13px; max-width: 46em; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.kpi { position: relative; display: block; padding: 12px 14px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass), rgba(15, 19, 27, .82); color: var(--text); overflow: hidden; min-width: 0; }
.kpi:hover { text-decoration: none; border-color: color-mix(in srgb, var(--kc) 45%, var(--line)); }
.kpi::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px; background: var(--kc); box-shadow: 0 0 10px var(--kc); }
.kpi b { display: block; font: 600 24px/1.2 var(--mono); }
.kpi small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hot { border-color: rgba(255, 107, 44, .45); background: linear-gradient(180deg, rgba(255, 107, 44, .12), rgba(255, 107, 44, .03)), rgba(15, 19, 27, .82); }
.kpi.hot b { color: #ffb08a; }

/* 运转图：你 → 宿主 → 各 Agent；连线上有流动的光点 */
.org { position: relative; margin-bottom: 30px; padding: 26px 22px 22px; border: 1px solid var(--line2); border-radius: 18px; background: radial-gradient(600px 260px at 50% 0%, rgba(255, 107, 44, .06), transparent 70%), rgba(10, 13, 19, .55); }
.org-node { position: relative; display: flex; align-items: center; gap: 14px; margin: 0 auto; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--glass), rgba(17, 22, 31, .92); box-shadow: var(--shadow); }
.org-node.you { width: min(420px, 100%); }
.org-node.host { width: min(470px, 100%); border-color: rgba(56, 208, 232, .35); box-shadow: 0 0 0 1px rgba(56, 208, 232, .08), 0 0 34px rgba(56, 208, 232, .1); }
.org-node b { font-size: 16px; font-weight: 650; }
.org-node small { display: block; color: var(--muted); font-size: 12.5px; }
.org-node .go { display: block; margin-top: 3px; font-size: 12.5px; color: var(--c-cyan); }
.ava { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #fff; background: radial-gradient(circle at 35% 30%, #ff9a64, #ff5a1a 60%, #c93d07); box-shadow: 0 0 22px rgba(255, 107, 44, .5); }
.pill { margin-left: auto; flex: none; padding: 4px 11px; border-radius: 8px; font: 600 12.5px var(--mono); white-space: nowrap; }
.pill.hot { color: #fff; background: linear-gradient(180deg, #ff7f45, #f1561a); box-shadow: 0 0 16px rgba(255, 107, 44, .5); }
.pill.calm { color: var(--ok); background: var(--ok-bg); }
a.pill:hover { text-decoration: none; filter: brightness(1.08); }
.radar { position: relative; width: 46px; height: 46px; flex: none; border-radius: 50%; border: 1px solid rgba(56, 208, 232, .45); background: radial-gradient(circle, rgba(56, 208, 232, .18) 0 18%, transparent 19% 44%, rgba(56, 208, 232, .14) 45% 46%, transparent 47%); overflow: hidden; }
.radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(56, 208, 232, .55), transparent 28%); animation: spin 3.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.org-link { display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center; gap: 10px; width: min(640px, 100%); margin: 0 auto; padding: 10px 0; }
.lbl { padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(12, 16, 23, .9); font: 11.5px/1.6 var(--mono); color: var(--muted); }
.lbl:first-child { justify-self: end; text-align: right; }
.lbl b { display: block; font-weight: 600; }
.lbl.down b { color: #ff9a6b; } .lbl.up b { color: var(--c-cyan); }
.wire { position: relative; height: 54px; margin: 0 auto; width: 2px; }
.wire::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 107, 44, .7), rgba(56, 208, 232, .7)); border-radius: 2px; }
.wire i { position: absolute; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--c-cyan), 0 0 4px #fff; animation: flow 2.2s linear infinite; }
.wire i + i { animation-delay: 1.1s; background: var(--c-orange); box-shadow: 0 0 10px var(--c-orange); animation-direction: reverse; }
@keyframes flow { from { top: -4px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { top: calc(100% - 4px); opacity: 0; } }
.org-drop { position: relative; height: 26px; }
.org-drop::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: linear-gradient(180deg, rgba(56, 208, 232, .7), rgba(56, 208, 232, .35)); }
.org-agents { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; padding-top: 22px; }
.org-agents::before { content: ""; position: absolute; top: 0; height: 2px; left: calc(50% / var(--n)); right: calc(50% / var(--n)); background: linear-gradient(90deg, transparent, rgba(56, 208, 232, .45) 8%, rgba(56, 208, 232, .45) 92%, transparent); }
.agent { position: relative; padding: 13px 14px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--glass), rgba(15, 19, 27, .92); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.agent::before { content: ""; position: absolute; left: 50%; top: -23px; height: 22px; width: 2px; margin-left: -1px; background: linear-gradient(180deg, rgba(56, 208, 232, .45), var(--ac)); opacity: .8; }
.agent:hover, .agent.busy { border-color: color-mix(in srgb, var(--ac) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent), 0 0 26px color-mix(in srgb, var(--ac) 22%, transparent); }
.agent.down { border-color: var(--bad-line); }
.agent-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.agent-h .ai { width: 8px; height: 8px; border-radius: 2px; background: var(--ac); box-shadow: 0 0 8px var(--ac); flex: none; }
.agent-h .st { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.agent-h .st.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.agent-h .st.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.agent-v { margin-top: 8px; display: flex; align-items: baseline; gap: 6px; }
.agent-v b { font: 600 24px/1 var(--mono); }
.agent-v small { color: var(--muted); font-size: 12px; }
.agent-m { margin-top: 6px; font: 11.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-m.bad { color: var(--bad); white-space: normal; }
.agent { display: flex; flex-direction: column; }
.agent-h { flex-wrap: wrap; row-gap: 4px; }
.agent-h .nm { white-space: nowrap; }
.agent-h .ttl { font: 500 11px/1.2 var(--sans, inherit); padding: 2px 7px; border-radius: 6px; color: color-mix(in srgb, var(--ac) 75%, var(--text)); background: color-mix(in srgb, var(--ac) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ac) 35%, transparent); white-space: nowrap; }
.agent-d { margin-top: 8px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.agent.down .agent-d { color: var(--faint); }
.agent-t { display: grid; gap: 3px; margin: 8px 0; font-size: 11.5px; }
.agent-t div { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; min-width: 0; }
.agent-t code { flex: none; padding: 0 5px; border-radius: 4px; font: 600 11px/17px var(--mono); color: var(--ac); background: color-mix(in srgb, var(--ac) 12%, transparent); }
.agent-t span { color: var(--muted); }
.agent-r { margin-top: auto; padding-top: 7px; border-top: 1px dashed var(--line); font: 11px/1.5 var(--mono); color: var(--faint); }
.agent-r b { color: var(--muted); font-weight: 600; }
.org-src { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; font: 12px var(--mono); color: var(--faint); }
.src { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(12, 16, 23, .9); color: var(--muted); }
.src:hover { text-decoration: none; color: var(--text); border-color: var(--faint); }
.src i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 8px var(--sc); }
.src b { color: var(--text); font-weight: 600; }

/* 待办 + 日志终端两栏 */
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 28px; }
.ov-grid > .sec { margin-bottom: 0; }
.alert { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 9px 14px; border: 1px solid rgba(255, 107, 44, .45); border-radius: 10px; background: rgba(255, 107, 44, .09); color: #ffb08a; font-size: 13px; }
.alert::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-orange); box-shadow: 0 0 8px var(--c-orange); flex: none; }
.alert.calm { border-color: rgba(61, 220, 151, .35); background: var(--ok-bg); color: var(--ok); }
.alert.calm::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.term { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(6, 8, 12, .92); box-shadow: var(--shadow); overflow: hidden; }
.term-h { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--line2); font: 12px var(--mono); color: var(--faint); }
.term-h i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; } .term-h i + i { background: #febc2e; } .term-h i + i + i { background: #28c840; margin-right: 6px; }
.term-h .tail { margin-left: auto; color: var(--ok); }
.term-b { max-height: 520px; overflow: auto; padding: 8px 0; font: 12px/1.75 var(--mono); }
.log { display: grid; grid-template-columns: 92px 64px minmax(0, 1fr); gap: 10px; padding: 0 14px; }
.log:hover { background: rgba(255, 255, 255, .03); }
.log .t { color: var(--faint); white-space: nowrap; }
.log .who { color: var(--lc, var(--c-cyan)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .what { color: #c9d0dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .what span { color: var(--faint); }
.log .what span.ok { color: var(--ok); } .log .what span.bad { color: var(--bad); } .log .what span.warn { color: var(--warn); }
.term-b .caret { display: inline-block; width: 7px; height: 13px; margin: 2px 0 0 14px; background: var(--ok); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 设计：左边按组列出全部文档，右边是正文 */
.docs { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.docnav { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--glass), rgba(15, 19, 27, .82); }
.docnav-t { margin: 2px 8px 8px; font-size: 12.5px; color: var(--muted); }
.docnav-t b { font: 600 12.5px var(--mono); color: var(--text); }
.docnav-d + .docnav-d { margin-top: 4px; border-top: 1px solid var(--line2); padding-top: 4px; }
.docnav-g { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font: 11.5px var(--mono); letter-spacing: .1em; color: var(--faint); cursor: pointer; list-style: none; user-select: none; }
.docnav-g::-webkit-details-marker { display: none; }
.docnav-g::before { content: "›"; display: inline-block; width: 8px; transition: transform .15s; }
.docnav-d[open] > .docnav-g::before { transform: rotate(90deg); }
.docnav-g span { margin-left: auto; }
.docnav-g:hover { color: var(--muted); background: rgba(255, 255, 255, .03); }
.docnav-i { display: block; padding: 7px 10px; border: 1px solid transparent; border-radius: 9px; color: var(--muted); }
.docnav-i:hover { text-decoration: none; color: var(--text); background: rgba(255, 255, 255, .04); }
.docnav-i span { display: block; font-size: 13.5px; }

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const num = (v) => (v == null || v === '' || isNaN(Number(v)) ? '—' : Number(v).toLocaleString('zh-CN'));
const DAY = 86400000;

function parseTime(v) { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function fullTime(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function relTime(d) {
  const s = (Date.now() - d.getTime()) / 1000, a = Math.abs(s), dir = s >= 0 ? '前' : '后';
  if (a < 60) return s >= 0 ? '刚刚' : '马上';
  if (a < 3600) return `${Math.round(a / 60)} 分钟${dir}`;
  if (a < 86400) return `${Math.round(a / 3600)} 小时${dir}`;
  return `${Math.round(a / 86400)} 天${dir}`;
}
function shortTime(d) { return `${d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '-' : ''}${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
/* 时间一律显示成本地时间的“11-11 14:05”，完整时间和相对时间放在 title 里 */
function T(v) {
  const d = parseTime(v);
  if (!d) return v ? esc(v) : '';
  return `<time datetime="${esc(v)}" title="${fullTime(d)}（${relTime(d)}）" class="nowrap">${shortTime(d)}</time>`;
}
const within24h = (v) => { const d = parseTime(v); return !!d && Date.now() - d.getTime() <= DAY; };

async function request(method, path, body) {
  let res;
  try {
    res = await fetch(path, { method, cache: 'no-store', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    const err = new Error('连不上管理 API'); err.network = true; throw err;
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 不是 JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `接口返回 ${res.status}`);
    err.status = res.status; err.code = data && data.code;
    throw err;
  }
  return data;
}
const api = (path) => request('GET', path);
const post = (path, body) => request('POST', path, body || {});

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const cut = raw.indexOf('?');
  const path = cut < 0 ? raw : raw.slice(0, cut);
  const q = Object.fromEntries(new URLSearchParams(cut < 0 ? '' : raw.slice(cut + 1)));
  const seg = path.split('/').filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  let view = seg[0] || 'overview', arg = seg.slice(1).join('/');
  if (view === 'tickets' && arg) view = 'ticket';
  if (!VIEWS[view]) view = 'overview';
  return { view, arg, q, key: `${view}|${arg}|${JSON.stringify(q)}` };
}
function H(view, q) {
  const qs = Object.entries(q || {}).filter(([, v]) => v != null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  return `#/${view}${qs ? '?' + qs : ''}`;
}

async function ensureCards(rows) {

  const need = rows.filter((t) => t.action === 'answer' && (S.cards[t.code] || {}).at !== t.updated_at);
  await Promise.all(need.map(async (t) => {
    try { const page = await api(`/api/tickets/${encodeURIComponent(t.code)}`); S.cards[t.code] = { at: t.updated_at, card: (page.attention || {}).card || null }; } catch (e) { /* 详情取不到就只显示问题本身 */ }

}

    await ensureCards(ov.needs_person || []);

    const ref = pick && (pick.tickets || [])[0];

  },

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq, r = S.route;
  const wantSettings = !S.settings || r.view === 'settings' || r.view === 'sources' || Date.now() - S.settingsAt > 30000;
  try {
    const [data, ov, settings, sources] = await Promise.all([
      LOADERS[r.view](r),
      r.view === 'overview' ? null : api('/api/overview'),
      wantSettings ? api('/api/settings') : null,
      S.sources ? null : api('/api/sources'),
    ]);
    if (seq !== loadSeq) return;
    S.ov = ov || data.ov;
    if (settings) { S.settings = settings; S.settingsAt = Date.now(); }
    const sourceRows = sources || data.sources;
    if (sourceRows) S.sources = Object.fromEntries(sourceRows.map((s) => [s.id, s.title]));
    S.data = data; S.dataKey = r.key; S.missing = null; S.err = null; S.okAt = new Date();
  } catch (e) {
    if (seq !== loadSeq) return;
    if (e.status === 404 && (r.view === 'ticket' || r.view === 'thread')) { S.missing = e.message; S.err = null; } else S.err = e.message || '取数失败';
  }
  render();
}

}
VIEWS.overview = ({ ov, open, log, asks, pick, tk }) => {
  const person = ov.needs_person || [];
  const codes = byId(open);
  /* 问题只列可以处理的：evals 这条健康项和“研判没有完成”是同一件事，effect:* 和“连续失败”也是，不重复列 */
  const effectKinds = (ov.problems || []).filter((p) => p.kind === 'effect').map((p) => p.title.split(' ')[0]);
  const problems = (ov.problems || []).filter((p) => !(p.kind === 'health' && (p.title === 'evals' || effectKinds.includes(p.title.replace(/^effect:/, '')))));
  const problemRow = (p) => {
    if (p.kind === 'eval') {
      return `<div class="row"><div class="row-main"><div class="row-head">${chip('研判没有完成', 'bad')}${threadLink(p.thread)}</div>
        <div class="row-sub">${esc(String(p.detail || '').replace(/^研判没有完成：/, ''))}</div>
        <div class="actions"><button class="btn primary" data-act="reevaluate" data-trigger="${esc(p.trigger_id)}">重新评估</button><button class="btn" data-act="dismiss" data-decision="${esc(p.decision_id)}">不再提示</button></div></div>
        <div class="row-meta">${T(p.at)}</div></div>`;
    }
    let title = p.title, link = '';
    const [kind, name] = String(p.title).split(':');
    if (kind === 'source' && name) { title = `来源「${sourceTitle(name)}」出错`; link = `<a href="#/sources">看来源</a>`; }
    else if (kind === 'effect' && name) title = `${HEALTH_EFFECT[name] || name}连续失败`;
    else if (kind === 'agent' && name) title = `Agent ${name} 不可用`;
    else if (p.title === 'runtime') title = '主循环出错';
    else if (p.kind === 'effect') title = `${HEALTH_EFFECT[p.title.split(' ')[0]] || p.title.split(' ')[0]}连续失败`;
    return `<div class="row"><div class="row-main"><div class="row-head">${chip(title, 'bad')}${link}</div><div class="row-sub">${esc(p.detail || '')}</div></div><div class="row-meta">${T(p.at)}</div></div>`;
  };
  const paused = ov.paused ? `<div class="banner"><b>处理已暂停</b><span>不再开始新的评估、执行，也不发消息。</span><button class="btn primary" data-act="resume-all">恢复处理</button></div>` : '';

  const flow = ov.flow || {}, trig = flow.triggers || {}, dec = flow.decisions || {};
  const trigTotal = Object.values(trig).reduce((a, b) => a + b, 0), decTotal = Object.values(dec).reduce((a, b) => a + b, 0);
  const ex = ov.executor || {}, agents = Object.entries(ov.agents || {});
  const running = (ex.tickets || []).map((id) => (codes[id] ? `<a class="code" href="${Hticket(codes[id].code)}">${codes[id].code}</a>` : '')).filter(Boolean).join(' ');
  const sick = agents.filter(([, a]) => a.state === 'open' || a.state === 'half_open' || !a.installed || a.paused);
  const agentRow = ([name, a]) => {
    let text = '', act = '';
    if (!a.installed) text = '本机没有装';
    else if (a.paused) { text = '已暂停'; act = `<button class="btn" data-act="resume-key" data-key="agent:${esc(name)}">恢复</button>`; }
    else if (a.state === 'open') {
      text = `熔断中：${BREAKER[a.kind] || a.kind || ''}${a.open_until ? `，${T(a.open_until)} 后自动再试` : ''}`;
      act = `<button class="btn" data-act="agent-reset" data-agent="${esc(name)}">现在恢复</button>`;
    } else text = '冷却结束，正在放一个任务试运行';
    return `<div class="row"><div class="row-main"><div class="row-head"><b>${esc(name)}</b>${chip(a.state === 'half_open' ? '试运行' : '不可用', a.state === 'half_open' ? 'info' : 'bad')}<span>${text}</span></div>
      ${a.last_error && a.state === 'open' ? `<div class="row-sub clamp">${esc(a.last_error)}</div>` : ''}${act ? `<div class="actions">${act}</div>` : ''}</div></div>`;
  };
  const ar = ov.autoreply;
  const AR_STATUS = { sent: ['已回', 'plain'], skipped: ['没回', 'line'], limited: ['到上限', 'warn'], failed: ['没生成出来', 'bad'], send_failed: ['发送失败', 'bad'], off: ['已关闭', 'line'] };
  const arRow = (r) => {
    const [label, tone] = AR_STATUS[r.status] || [r.status, 'line'];
    return `<div class="row"><div class="row-main"><div class="row-head">${chip(r.kind === 'direct' ? '单聊' : '群里 @我', 'line')}<b>${esc(r.sender || '')}</b>${chip(label, tone)}${r.escalated ? chip('已转告你', 'warn') : ''}</div>
      <div class="row-sub clamp">${esc(r.text || '')}</div>${r.reply ? `<div class="row-sub clamp">↳ ${esc(r.reply)}</div>` : ''}${r.note && r.status !== 'sent' ? `<div class="row-sub faint clamp">${esc(r.note)}</div>` : ''}</div>

  };
  const autoreply = ar ? `<section class="sec"><h2>${esc(ar.app || '钉钉')}自动回复 <span class="hint">别人单聊你、或在群里 @你 时，Agent 以你的身份回复（运营群照旧走工单）</span></h2>

      ${ar.mode === m ? chip('当前', 'info') : `<button class="btn${m === 'off' ? '' : ' primary'}" data-act="autoreply" data-mode="${m}">${m === 'auto' ? '打开自动回复…' : '关掉'}</button>`}</div>`).join('')}</div>

  const kpi = (v, label, color, href, hot) => `<a class="kpi${hot ? ' hot' : ''}" style="--kc:${color}" href="${href}"><b>${v}</b><small>${label}</small></a>`;

      <h1>运转图 <span class="live-tag">LIVE</span></h1>
      <p>触发从来源进来，宿主研判后接单、派给各个 Agent；要人拍板的事回到你这里。数据 ${ov.at ? T(ov.at) : ''} 生成，页面每 5 秒自己刷新。</p></div>
    <div class="kpis">${[
      kpi(person.length, '等你处理', 'var(--c-orange)', H('tickets', { f: 'person' }), person.length > 0),
      kpi(o.total || 0, '未结束工单', 'var(--c-cyan)', H('tickets', { f: 'open' })),
      kpi(`${ex.running || 0}<span class="faint">/${ex.max || 0}</span>`, '执行位在跑', 'var(--c-green)', H('tickets', { f: 'working' })),
      kpi(trigTotal, '24 小时触发', 'var(--c-blue)', H('triggers', { view: 'flat', h: 24 })),
      kpi(dec.accept || 0, '24 小时接单', 'var(--c-purple)', H('evals', { f: 'accept', h: 24 })),
      kpi(flow.tickets_ended || 0, '24 小时结束', 'var(--c-pink)', H('tickets', { f: 'ended', h: 24 })),
    ].join('')}</div></section>`;

  /* 运转图 */

  const decLine = Object.keys(DECISION_LABELS).filter((k) => dec[k]).map((k) => `${DECISION_LABELS[k]} ${dec[k]}`).join(' · ');
  const agentCard = ([name, a], i) => {
    const color = AGENT_LOOK[name] || LOOK_CYCLE[i % LOOK_CYCLE.length];
    const down = !a.installed || a.paused || a.state === 'open';
    const st = down ? 'bad' : a.state === 'half_open' ? 'warn' : '';
    const why = !a.installed ? '本机没有装' : a.paused ? '已暂停' : a.state === 'open' ? `熔断中：${BREAKER[a.kind] || a.kind || ''}` : a.state === 'half_open' ? '试运行中' : '';
    const rules = (a.rules || []).filter((r) => r.enabled), backup = (a.backup || []).map((r) => CHAIN_ROLES[r] || r);
    const ruleTip = rules.map((r) => r.name).join('、');
    const foot = [rules.length ? `主跑 <b>${rules.length}</b> 条规则` : '', backup.length ? `兜底 ${esc(backup.join(' '))}` : ''].filter(Boolean).join(' · ');
    /* 模型和思考强度：同一个模型 + 强度的角色并成一行，如“fable · high：拍方向 开发” */
    const tuned = {};
    Object.entries(a.models || {}).forEach(([role, t]) => { const k = [t.model || 'CLI 默认', t.effort].filter(Boolean).join(' · '); (tuned[k] = tuned[k] || []).push(TUNE_ROLES[role] || role); });
    const tuneHtml = Object.keys(tuned).length ? `<div class="agent-t">${Object.entries(tuned).map(([k, roles]) => `<div title="${esc(k)}：${esc(roles.join('、'))}"><code>${esc(k)}</code><span>${esc(roles.join(' '))}</span></div>`).join('')}</div>`
      : a.default_model || a.default_effort ? `<div class="agent-t"><div><code>${esc([a.default_model, a.default_effort].filter(Boolean).join(' · '))}</code><span>全部</span></div></div>` : '';
    return `<div class="agent${a.busy ? ' busy' : ''}${down ? ' down' : ''}" style="--ac:${color}" title="${esc(name)}${a.title ? '（' + esc(a.title) + '）' : ''}：并发 ${a.concurrency || 0}${why ? '，' + esc(why) : ''}${ruleTip ? '\n主跑：' + esc(ruleTip) : ''}">
      <div class="agent-h"><span class="ai"></span><span class="nm">${esc(name)}</span>${a.title ? `<span class="ttl">${esc(a.title)}</span>` : ''}<span class="st ${st}"></span></div>
      <div class="agent-v"><b>${a.busy || 0}</b><small>/ ${a.concurrency || 0} 在跑</small></div>
      ${why ? `<div class="agent-m bad">${esc(why)}</div>` : ''}
      <div class="agent-d">${esc(a.duty || '待命')}</div>${tuneHtml}
      ${foot ? `<div class="agent-r">${foot}</div>` : ''}</div>`;
  };
  const credit = ov.counters && ov.counters.budget ? ` · 今日积分 ${num(ov.counters.popto_credits || 0)}/${num(ov.counters.budget)}` : '';
  const org = `<section class="org" aria-label="运转图">
    <div class="org-node you"><span class="ava">我</span><div><b>你</b><small>拍板 · 定方向 · 回答 Agent 的问题</small></div>
      ${person.length ? `<a class="pill hot" href="${H('tickets', { f: 'person' })}">等你 ${person.length} 件</a>` : '<span class="pill calm">没有待办</span>'}</div>
    <div class="org-link">
      <div class="lbl down"><b>↓ 拍板 · 回答</b>${person.length ? `等回答 ${asked} · 受阻/失败 ${broken}` : '现在没有要你决定的'}</div>
      <div class="wire"><i></i><i></i></div>
      <div class="lbl up"><b>↑ 汇报 · 交付</b>24h 新开 ${flow.tickets_created || 0} · 结束 ${flow.tickets_ended || 0}</div>
    </div>
    <div class="org-node host"><span class="radar"></span><div><b>宿主 · 主 Session</b><small>准入 → 研判 → 接单 → 派工 · 模式 ${esc(ov.mode || '')}（${esc(MODE_SHORT[ov.mode] || '')}）</small>
      <a class="go" href="${H('evals', { f: 'all', h: 24 })}">24h 决定 ${decTotal}${decLine ? '：' + decLine : ''}${flow.would_accept ? ` · 本来会接单 ${flow.would_accept}` : ''}</a></div></div>
    <div class="org-drop"></div>
    <div class="org-agents" style="--n:${Math.max(agents.length, 1)}">${agents.map(agentCard).join('')}</div>
    <div class="org-src"><span>↑ 触发来源 · 24h</span>${Object.entries(trig).map(([sname, n]) => `<a class="src" style="--sc:${SOURCE_COLOR[sname] || 'var(--c-cyan)'}" href="${H('triggers', { view: 'flat', h: 24, source: sname })}"><i></i>${esc(sourceTitle(sname))} <b>${n}</b></a>`).join('') || '<span>还没有触发</span>'}<span>执行位 ${ex.running || 0}/${ex.max || 0}${running ? '：' + running : ''}${credit}</span></div>

    ${person.length ? `<div class="alert">等你处理 ${person.length} 件${asked ? ` · 等你回答 ${asked}` : ''}${broken ? ` · 受阻或失败 ${broken}` : ''}</div><div class="list">${person.map(ticketRow).join('')}</div>`
      : '<div class="alert calm">没有需要你处理的事</div>'}</section>`;
  const term = `<section class="sec"><div class="term"><div class="term-h"><i></i><i></i><i></i>company.log — 最近的触发和去向<span class="tail">● tail -f</span></div>
    <div class="term-b">${(log || []).map(logLine).join('') || '<div class="log"><span class="what">还没有触发</span></div>'}<span class="caret"></span></div></div></section>`;

VIEWS.sources = ({ sources, dropped }) => {
  const st = S.settings || {};
  const STATE = { ready: ['运行中', 'plain'], off: ['已关闭', 'line'], error: ['出错', 'bad'], waiting: ['等待中', 'warn'] };
  const card = (s) => {
    const [label, tone] = STATE[s.state] || [s.state, 'plain'];
    const lost = (dropped || []).filter((m) => (m.channel || {}).source === s.id && m.reason !== 'withdrawn' && within24h(m.at));
    const nums = [];
    if (s.enabled || s.triggers_24h) nums.push(`<span>触发 <a href="${H('triggers', { view: 'flat', h: 24, source: s.id })}"><b>${s.triggers_24h}</b></a></span>`);
    if (s.filtered_24h) nums.push(`<span>被过滤 <a href="${H('triggers', { view: 'flat', h: 24, source: s.id, only: 'filtered' })}"><b>${s.filtered_24h}</b></a></span>`);
    if (s.dropped_24h) nums.push(`<span>丢弃的消息 <b style="color:var(--bad)">${s.dropped_24h}</b></span>`);
    const lostList = lost.length ? `<details class="inline" data-k="lost:${esc(s.id)}"${S.ui.open['lost:' + s.id] ? ' open' : ''}><summary>看丢弃的 ${lost.length} 条</summary><div>${lost.map((m) => `<div class="row-sub">${T(m.at)} · ${esc(DROP_REASON[m.reason] || m.reason || '')}
      · ${m.ticketId ? `<a href="${Hticket(m.ticketId)}">它的工单</a>` : esc(threadName(`${m.channel.source}:${m.channel.thread}`))}<div class="clamp">${esc(m.text || '')}</div></div>`).join('')}</div></details>` : '';
    return `<div class="card"><h3>${esc(s.title)}${chip(label, tone)}</h3>
      ${s.detail ? `<div class="row-sub${s.state === 'error' ? '' : ' faint'}"${s.state === 'error' ? ' style="color:var(--bad)"' : ''}>${esc(s.detail)}</div>` : ''}
      ${s.enabled ? '' : '<div class="row-sub faint">在 policy.yaml / local.yaml 的 sources 里打开</div>'}
      ${nums.length ? `<div class="nums">${nums.join('')}</div>` : ''}${lostList}</div>`;
  };
  const rules = st.rules || [];
  const ruleFor = (type) => rules.find((r) => r.when && r.when.origin.some((o) => o === '*' || o === 'cron') && r.when.types.some((p) => globMatch(p, type)));
  const when = (s) => {
    if (s.every) return `每 ${durationText(s.every)}`;
    const parts = String(s.at || '').trim().split(/\s+/);
    return parts.length === 2 ? `每${WEEKDAYS[parts[0].toUpperCase().slice(0, 3)] || parts[0]} ${parts[1]}` : `每天 ${parts[0]}`;
  };
  const schedules = table([
    { h: '定时', f: (s) => `<a class="mono" href="${Hthread('schedule:' + s.type)}">${esc(s.type)}</a>` },
    { h: '名称', f: (s) => (s.name ? esc(s.name) : '<span class="faint">—</span>') },
    { h: '什么时候', f: (s) => `<span class="nowrap">${esc(when(s))}</span>` },
    { h: '谁来接', f: (s) => { const r = ruleFor(s.type); return r ? `规则「${esc(r.name)}」${r.paused ? ' ' + chip('已暂停', 'warn') : ''}${r.enabled ? '' : ' ' + chip('已停用')}` : '<span class="faint">没有规则接，触发会被忽略</span>'; } },
    { h: '备注', f: (s) => [s.max_late ? `错过超过 ${durationText(s.max_late)} 不补` : '', s.requires ? `配了 ${esc(s.requires)} 才触发` : ''].filter(Boolean).join('；') || '<span class="faint">—</span>' },
  ], st.schedules, '没有定时（schedules.yaml 是空的）');
  return `<section class="sec"><h2>来源 <span class="hint">数字是过去 24 小时的</span></h2><div class="cards">${sources.map(card).join('')}</div></section>
  <section class="sec"><h2>定时表 <span class="cnt">${(st.schedules || []).length}</span><span class="hint">改 schedules.yaml 后在设置页重新加载</span></h2><div class="list">${schedules}</div></section>`;
};

VIEWS.triggers = (d, r) => {
  const flat = r.q.view === 'flat';
  const modes = `<span class="seg"><a class="${flat ? '' : 'on'}" href="${H('triggers', { f: r.q.f })}">按线程</a><a class="${flat ? 'on' : ''}" href="${H('triggers', { view: 'flat' })}">触发流水</a></span>`;
  if (flat) {
    let rows = d.triggers || [];
    const tickets = Object.fromEntries((d.decisions || []).filter((x) => x.ticket).map((x) => [x.id, x.ticket]));
    if (r.q.h) rows = rows.filter((t) => within24h(t.at));
    if (r.q.only === 'filtered') rows = rows.filter((t) => t.filtered);
    const q = (extra) => Object.assign({ view: 'flat', h: r.q.h, source: r.q.source, only: r.q.only }, extra);
    const chips = [`<a class="fchip${r.q.h ? ' on' : ''}" href="${H('triggers', q({ h: r.q.h ? '' : 24 }))}">过去 24 小时</a>`,
      `<a class="fchip${r.q.only ? ' on' : ''}" href="${H('triggers', q({ only: r.q.only ? '' : 'filtered' }))}">只看被过滤的</a>`,
      r.q.source ? `<a class="fchip on" href="${H('triggers', q({ source: '' }))}">${esc(sourceTitle(r.q.source))} ✕</a>` : ''].join('');
    return `<div class="filters">${modes}<span class="fsep"></span>${chips}</div>
      <section class="sec"><h2>触发 <span class="cnt">${rows.length}</span>${(d.triggers || []).length >= 500 ? '<span class="hint">只取了最近 500 条</span>' : ''}</h2>
      ${rows.length ? `<div class="list">${rows.map((t) => triggerRow(t, { tickets })).join('')}</div>` : '<div class="quiet">没有符合的触发</div>'}</section>`;
  }
  const all = d.threads || [], f = r.q.f || 'recent';
  const pick = { subscribed: (t) => t.tickets.length > 0, evaluating: (t) => t.pending > 0 || t.evaluating, recent: (t) => within24h(t.last_at), all: () => true };
  const rows = all.filter(pick[f] || pick.all);
  const row = (t) => {
    const state = [];
    if (t.evaluating) state.push(chip('评估中', 'info'));
    if (t.pending) state.push(chip(`排队 ${t.pending} 条`, 'info') + (t.hold_until && parseTime(t.hold_until) > new Date() ? `<span class="muted">来源说 ${T(t.hold_until)} 之后再评估</span>` : ''));
    const subs = t.tickets.map((k) => `<span class="nowrap">${ticketLink(k)} <span class="${k.live ? '' : 'faint'}">${esc(k.title)}${k.live ? '' : '（已结束）'}${k.context ? '（仅上下文）' : ''}</span></span>`).join('　');
    return `<div class="row"><div class="row-main"><div class="row-head"><a class="title" href="${Hthread(t.key)}">${esc(threadName(t.key))}</a>${state.join('')}</div>
      ${subs ? `<div class="row-sub">订阅：${subs}</div>` : ''}</div><div class="row-meta">${t.last_at ? '最近触发 ' + T(t.last_at) : '还没有触发'}</div></div>`;
  };
  return `<div class="filters">${modes}<span class="fsep"></span>${filters('triggers', f, [['subscribed', '有订阅', all.filter(pick.subscribed).length], ['evaluating', '评估中', all.filter(pick.evaluating).length],
    ['recent', '24 小时内有新触发', all.filter(pick.recent).length], ['all', '全部', all.length]])}</div>
    ${rows.length ? `<div class="list">${rows.map(row).join('')}</div>` : '<div class="quiet">没有符合的线程</div>'}`;
};

VIEWS.thread = ({ page: p }) => {
  const tickets = Object.fromEntries((p.decisions || []).filter((x) => x.ticket).map((x) => [x.id, x.ticket]));
  const state = [p.evaluating ? chip('评估中', 'info') : '', p.pending ? chip(`排队 ${p.pending} 条`, 'info') : ''].join('');
  const subs = (p.tickets || []).map((k) => `<div class="row"><div class="row-main"><div class="row-head">${ticketLink(k)}<a class="title" href="${Hticket(k.code)}">${esc(k.title)}</a>${k.live ? '' : chip('已结束')}${k.context ? chip('仅上下文', 'line', '只读这个线程了解上下文，不因它获得权限') : ''}</div></div></div>`).join('');
  return `<div class="crumbs"><a href="#/triggers">触发</a> / 线程</div>
  <div class="thead"><h1>${esc(threadName(p.key))}</h1>${state}</div>
  <div class="subline">${p.last_at ? '最近触发 ' + T(p.last_at) : '还没有触发'}${p.hold_until && parseTime(p.hold_until) > new Date() ? ` · 来源说 ${T(p.hold_until)} 之后再评估` : ''}</div>
  <section class="sec"><h2>订阅它的工单 <span class="cnt">${(p.tickets || []).length}</span><span class="hint">线程上之后的触发会送到这些工单</span></h2>${subs ? `<div class="list">${subs}</div>` : '<div class="quiet">没有工单订阅这个线程</div>'}</section>
  <section class="sec"><h2>时间线 <span class="cnt">${(p.triggers || []).length}</span><span class="hint">新的在上</span></h2>${(p.triggers || []).length ? `<div class="list">${p.triggers.map((t) => triggerRow(t, { tickets, thread: false })).join('')}</div>` : '<div class="quiet">这个线程上还没有触发</div>'}</section>
  <section class="sec"><h2>决定 <span class="cnt">${(p.decisions || []).length}</span></h2>${(p.decisions || []).length ? `<div class="list">${p.decisions.map((x) => decisionRow(x, { thread: false, triggers: byId(p.triggers) })).join('')}</div>` : '<div class="quiet">还没有决定</div>'}</section>
  ${(p.correlated || []).length ? `<section class="sec"><h2>关联的线程 <span class="hint">共用过触发，只提供上下文</span></h2><div class="quiet">${p.correlated.map(threadLink).join('　')}</div></section>` : ''}
  ${fold('thread-id', '详情', `<dl class="kv">${idLine('线程键', p.key)}</dl>`)}`;
};

VIEWS.evals = (d, r) => {
  const f = r.q.f || 'all';
  let rows = d.decisions || [];
  if (r.q.h) rows = rows.filter((x) => within24h(x.at));
  const window = r.q.h ? `<span class="fsep"></span><a class="fchip on" href="${H('evals', { f })}">过去 24 小时 ✕</a>` : '';
  const hint = f === 'would_accept' ? `<div class="quiet" style="margin-bottom:10px">observe 模式下记下的“如果切到 auto 会发生什么”：这些事件命中了规则，本来会开工单。${(S.ov || {}).mode === 'auto' ? '现在已经是 auto。' : `看着都对，就去<a href="#/settings">设置</a>切到 auto。`}</div>` : '';
  return `<div class="filters">${filters('evals', f, [['all', '全部'], ['accept', '接单'], ['ignore', '忽略'], ['unavailable', '未完成'], ['would_accept', '本来会接单']], { h: r.q.h })}${window}</div>${hint}
  <section class="sec"><h2>决定 <span class="cnt">${rows.length}</span></h2>
  ${rows.length ? `<div class="list">${rows.map((x) => decisionRow(x, { triggers: byId(d.triggers) })).join('')}</div>` : '<div class="quiet">没有符合的决定</div>'}</section>`;
};

VIEWS.tickets = (d, r) => {
  const ov = S.ov || {}, ex = ov.executor || {}, f = r.q.f || 'person', open = d.open || [];
  const pick = { person: (t) => t.stage === 'person', open: () => true, queued: (t) => t.action === 'queued', working: (t) => t.stage === 'working' && t.action !== 'queued', idle: (t) => t.stage === 'idle' };
  let rows, title = '', window = '';
  if (f === 'ended') { rows = d.other; if (r.q.h) { rows = rows.filter((t) => within24h(t.ended_at || t.updated_at)); title = '过去 24 小时结束的'; } }
  else if (f === 'all') { rows = d.other.filter((t) => !r.q.h || within24h(t.created_at)); title = r.q.h ? '过去 24 小时新开的' : '全部工单'; }
  else rows = open.filter(pick[f] || pick.open);
  if (r.q.h || f === 'all') window = `<span class="fsep"></span><a class="fchip on" href="${H('tickets', { f: f === 'all' ? 'open' : f })}">${esc(title)} ✕</a>`;
  const running = (ex.tickets || []).map((id) => open.find((t) => t.id === id)).filter(Boolean).map(ticketLink).join(' ');
  const control = ov.paused
    ? `<div class="banner"><b>处理已暂停</b><span>不再开始新的评估、执行，也不发消息。</span><button class="btn primary" data-act="resume-all">恢复处理</button></div>`
    : `<div class="quiet" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span>执行位 <b class="num">${ex.running || 0} / ${ex.max || 0}</b>${running ? `：${running}` : ''}</span><span class="spacer"></span><button class="btn" data-act="pause-all">暂停处理…</button></div>`;
  const EMPTY = { person: '没有等你处理的工单', open: '没有进行中的工单', queued: '没有在排队的工单', working: '没有正在工作的工单', idle: '没有在等后续事件的工单', ended: '没有已结束的工单', all: '没有工单' };
  return `${control}<div class="filters">${filters('tickets', f === 'all' ? '' : f, [['person', '等人', open.filter(pick.person).length], ['open', '进行中全部', open.length], ['queued', '排队', open.filter(pick.queued).length],
    ['working', '工作中', open.filter(pick.working).length], ['idle', '等后续事件', open.filter(pick.idle).length], ['ended', '已结束']])}${window}</div>
  <section class="sec">${title || f === 'ended' ? `<h2>${esc(title || '已结束')} <span class="cnt">${rows.length}</span></h2>` : ''}${ticketList(rows, EMPTY[f] || '没有工单')}</section>`;
};

VIEWS.ticket = ({ page: p }) => {
  const card = (p.attention || {}).card;
  const tone = p.stage === 'person' ? stageTone(p) : '';
  const LEAD = {
    'person/answer': '在等你回答', 'person/review': '结果已经就绪，等你验收', 'person/blocked': '执行器受阻，等你给信息或重试', 'person/failed': '执行失败，等你处理',
    'person/delivery': '输入没有送到执行器，等你重试', 'working/queued': '在排队等执行位', 'working/': '执行器正在工作', 'idle/': '在等后续事件：它订阅的线程上有新触发就会继续',
  };
  let now;
  if (p.outcome) {
    now = `<div class="lead">${esc(p.label)}</div>${p.ended_reason ? `<div class="row-sub">${esc(p.ended_reason)}</div>` : ''}${p.report ? `<div class="row-sub">最后一次报告（${esc(REPORT_STATE[p.report.state] || p.report.state)}，${T(p.report.at)}）</div><pre class="text">${esc(p.report.summary)}</pre>` : ''}
      <div class="row-sub faint">${p.outcome === 'stopped' ? '被人停止的工单不再收任何消息；新的工作要重新接单。' : '人在它的线程上再发消息，会在原授权下恢复它。'}</div>`;
  } else {
    now = `<div class="lead">${esc(LEAD[`${p.stage}/${p.action || ''}`] || p.label)}</div>`;
    if (p.action === 'answer') now += `<div class="row-sub q">${esc(p.question || '')}</div>${cardBlock(card)}${expiryLine(p, card)}`;
    else if (p.action === 'delivery') now += `<pre class="text err">${esc(p.delivery_error || '')}</pre>`;
    else if (p.report) now += `<pre class="text${p.action === 'failed' ? ' err' : ''}">${esc(p.report.summary)}</pre>`;
    if (p.action === 'review' && (p.follows || []).length) now += `<div class="row-sub faint">它跟随的线程（${p.follows.map((x) => esc(threadName(x.thread))).join('、')}）关闭后，工单会随之结束。</div>`;
  }
  const answered = (p.answered || []).map((a) => `<div class="row-sub">${T(a.at)} ${esc(a.by)} 对「${esc(a.question)}」选了「${esc(a.label || a.option)}」${a.reason ? `：${esc(a.reason)}` : ''}${a.expired ? '（到期自动处理）' : ''}</div>`).join('');
  const basis = p.basis || {}, dec = p.decision, origin = p.origin;
  const current = (S.ov || {}).policy_version;
  const mandate = `<dl class="kv">
    <dt>强度</dt><dd>${p.strength === 'explicit' ? '明确：名单内的人明确提出的请求' : '推断：规则允许的主动工作'}</dd>
    <dt>规则</dt><dd>${p.rule ? `<b>${esc(p.rule)}</b>${p.rule_instruction ? `<div class="muted">${esc(p.rule_instruction)}</div>` : ''}${p.tell ? `<div class="faint">${esc(TELL[p.tell] || p.tell)}</div>` : ''}` : '<span class="muted">没有规则：明确请求用默认的执行方式</span>'}</dd>
    <dt>范围</dt><dd>${esc(p.scope || '—')}</dd>
    <dt>发起</dt><dd>${esc(sourceTitle(basis.source || (p.actor || {}).source || ''))}${basis.sender || (p.actor || {}).id ? ` · ${esc(basis.sender || p.actor.id)}` : ''}${basis.via ? ` · ${esc(VIA[basis.via] || basis.via)}` : ''}</dd>
    <dt>策略版本</dt><dd><span class="mono">${esc(p.policy_version)}</span>${current && current !== p.policy_version ? ` <span class="faint">接单之后策略改过，现在是 <span class="mono">${esc(current)}</span></span>` : ''}</dd>
    <dt>起点触发</dt><dd>${origin ? `${T(origin.at)} · ${(origin.threads || []).slice(0, 1).map(threadLink).join('')}<div class="clamp">${esc(origin.text || '')}</div>` : '<span class="faint">已不在库里</span>'}</dd>
    <dt>决定</dt><dd>${dec ? `${chip(dec.label, DECISION_TONE[dec.kind])} ${esc(dec.reason)} <span class="faint">· ${dec.direct ? '规则直配' : '主 Session 研判'} · ${T(dec.at)}</span>` : '<span class="faint">已不在库里</span>'}</dd></dl>`;
  const inputRow = (i) => `<div class="row"><div class="row-main"><div class="row-head">${chip(i.kind === 'trigger' && i.human ? '人的消息' : INPUT_KIND[i.kind] || i.kind, i.human ? 'info' : 'plain')}${i.waiting ? chip('还没送到执行器', 'warn') : ''}${i.context ? chip('仅上下文', 'line') : ''}
    ${i.actor ? `<span>${esc(i.actor)}</span>` : ''}${i.type ? `<span class="mono">${esc(i.type)}</span>` : ''}</div><div class="row-text clamp">${esc(i.text || '')}</div>${i.note ? `<div class="row-sub">路由备注：${esc(i.note)}</div>` : ''}</div><div class="row-meta">${T(i.at)}</div></div>`;
  const inputs = p.inputs || [], waiting = inputs.filter((i) => i.waiting);
  const threads = (p.threads || []).map((t) => `<div class="row"><div class="row-main"><div class="row-head">${threadLink(t.key)}${t.bound ? chip('工单自己的线程', 'line', '例如它开的 MR；这个线程关了工单随之结束') : ''}${t.context ? chip('仅上下文', 'line') : ''}</div></div></div>`).join('');
  const assignments = (p.assignments || []).map((a, i, all) => `<div class="row"><div class="row-main"><div class="row-head"><b>第 ${all.length - i} 次</b>${chip(ASSIGN_STATE[a.state] || a.state, a.state === 'running' ? 'info' : 'plain')}
    ${a.ended_reason ? `<span class="muted">${esc(ENDED_REASON[a.ended_reason] || a.ended_reason)}</span>` : ''}</div>
    ${a.report ? `<div class="row-sub">${chip('报告：' + (REPORT_STATE[a.report.state] || a.report.state), REPORT_TONE[a.report.state])} ${T(a.report.at)}</div><div class="row-text clamp">${esc(a.report.summary)}</div>` : '<div class="row-sub faint">还没有报告</div>'}</div>
    <div class="row-meta">${a.started_at ? '开始 ' + T(a.started_at) : '创建 ' + T(a.created_at)}${a.ended_at ? '<br>结束 ' + T(a.ended_at) : ''}</div></div>`).join('');
  const runs = (p.runs || []).map((x) => `<div class="row"><div class="row-main"><div class="row-head"><b>${esc(x.agent)}</b>${x.model || x.effort ? `<span class="mchip" style="--mc:var(--c-purple)" title="这一轮实际用的模型和思考强度">${esc([x.model, x.effort].filter(Boolean).join(' · '))}</span>` : ''}<span class="muted">${esc(ROLES[x.role] || x.role || '')}</span>${x.is_fallback ? chip('降级', 'warn', '主 Agent 不可用或太忙，由降级链上的下一个接手') : ''}
    ${chip(RUN_STATUS[x.status] || x.status, x.status === 'ok' ? 'plain' : 'bad')}<span class="muted num">${x.duration_s == null ? '' : `${x.duration_s} 秒`}</span>${x.cost_usd ? `<span class="muted num">$${Number(x.cost_usd).toFixed(2)}</span>` : ''}</div>
    ${x.error_detail ? `<pre class="text err">${esc(x.error_detail)}</pre>` : ''}</div><div class="row-meta">${T(x.started_at)}</div></div>`).join('');
  const messages = (p.messages || []).map((m) => `<div class="row"><div class="row-main"><div class="row-head">${chip(MSG_KIND[m.kind] || m.kind, 'line')}${chip(MSG_STATUS[m.status] || m.status, m.status === 'sent' ? 'plain' : m.status === 'pending' ? 'warn' : m.reason === 'withdrawn' ? 'plain' : 'bad')}
    ${m.status === 'dropped' ? `<span class="muted">${esc(DROP_REASON[m.reason] || m.reason || '')}</span>` : ''}<span class="muted">发往 ${esc(threadName(`${m.channel.source}:${m.channel.thread}`))}</span></div><pre class="text">${esc(m.text)}</pre></div><div class="row-meta">${T(m.at)}</div></div>`).join('');
  const cnt = (n) => `<span class="cnt">${n}</span>`;
  const key = `t:${p.code}:`;
  return `<div class="crumbs"><a href="#/tickets">执行</a> / ${esc(p.code)}</div>
  <div class="thead"><h1><span class="code" style="font-size:17px">${esc(p.code)}</span> ${esc(p.title)}</h1>${chip(p.label, stageTone(p))}</div>
  <div class="subline">${p.rule ? `规则「${esc(p.rule)}」` : '明确请求'} · 创建 ${T(p.created_at)} · 更新 ${T(p.updated_at)}</div>
  <section class="panel now ${tone}">${now}${answered}${ticketActions(p, { stop: true })}</section>
  ${waiting.length ? fold(key + 'waiting', `等待中的输入 ${cnt(waiting.length)}<span class="hint">还没送到执行器</span>`, waiting.map(inputRow).join(''), true, true) : ''}
  ${fold(key + 'mandate', '授权<span class="hint">为什么可以做、能做到哪</span>', mandate, true)}
  ${fold(key + 'threads', `订阅的线程 ${cnt((p.threads || []).length)}`, threads || '<div class="empty small">没有订阅线程</div>', false, true)}
  ${fold(key + 'assign', `派工与报告 ${cnt((p.assignments || []).length)}`, assignments || '<div class="empty small">还没有派工</div>', false, true)}
  ${fold(key + 'runs', `运行 ${cnt((p.runs || []).length)}${(p.runs || []).some((x) => x.status !== 'ok') ? '<span class="hint" style="color:var(--bad)">有失败</span>' : ''}${(p.runs || []).some((x) => x.is_fallback) ? '<span class="hint">有降级</span>' : ''}`, runs || '<div class="empty small">还没有运行</div>', false, true)}
  ${fold(key + 'msgs', `发出的消息 ${cnt((p.messages || []).length)}`, messages || '<div class="empty small">没有发过消息</div>', false, true)}
  ${fold(key + 'inputs', `全部输入 ${cnt(inputs.length)}`, inputs.slice().reverse().map(inputRow).join('') || '<div class="empty small">没有输入</div>', false, true)}
  ${fold(key + 'ids', '详情', `<dl class="kv">${idLine('工单 id', p.id)}${idLine('决定 id', (dec || {}).id)}${idLine('起点触发 id', (origin || {}).id)}${idLine('工作目录', p.directory)}</dl>`)}`;
};

function chatSection(c) {
  if (!c) return '';
  const card = (app) => {
    const a = c.apps[app], on = a.enabled;
    const groups = a.chats.length ? a.chats.map((g) => `${g.name ? esc(g.name) + ' ' : ''}<span class="mono faint">${esc(g.id)}</span>`).join('<br>') : '<span class="faint">没配群</span>';
    const people = a.approvers.length ? a.approvers.map((p) => `<span class="chip line" style="gap:6px">${esc(p.name || p.id)}${p.name ? ` <span class="mono faint">${esc(p.id)}</span>` : ''}
      <button class="btn" style="padding:0 6px;height:20px" data-act="chat-unapprove" data-app="${app}" data-id="${esc(p.id)}" data-name="${esc(p.name || p.id)}" title="移出审批人">×</button></span>`).join(' ') : '<span class="faint">空：没有人能在群里提请求或批红</span>';
    const tone = !on ? 'line' : a.state === 'error' ? 'bad' : 'ok';
    return `<div class="box" style="padding:14px 16px;flex:1;min-width:300px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:15px">${esc(a.title)}</b>${on ? chip('当前使用', 'info') : chip('未使用', 'line')}${on ? chip(a.state === 'error' ? '出错' : '正常', tone, a.state_detail || '') : ''}
        <span class="spacer"></span>${on ? '' : `<button class="btn primary" data-act="chat-switch" data-app="${app}" data-title="${esc(a.title)}">切到${esc(a.title)}…</button>`}</div>
      <dl class="kv"><dt>群</dt><dd>${groups}<div><button class="btn small" data-act="chat-group" data-app="${app}" data-title="${esc(a.title)}">改群…</button></div></dd>
      <dt>审批人</dt><dd>${people}<div style="margin-top:4px"><button class="btn small" data-act="chat-approve" data-app="${app}" data-title="${esc(a.title)}">添加审批人…</button></div></dd>
      <dt>登录</dt><dd>${a.login.ok ? `<span style="color:var(--ok)">✓</span> ${esc(a.login.detail)}` : `<span style="color:var(--bad)">✗ ${esc(a.login.detail)}</span><div class="faint">${esc(a.login.fix)}</div>`}</dd>
      ${on && a.state === 'error' ? `<dt>状态</dt><dd style="color:var(--bad)">${esc(a.state_detail)}</dd>` : ''}</dl></div>`;
  };
  const home = c.home || {};
  return `<section class="sec"><h2>聊天渠道 <span class="hint">钉钉和飞书二选一：在哪个软件里收请求、发问题卡片、批红、发结果、自动回复</span></h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap">${card('dingtalk')}${card('lark')}</div>
    <div class="hint" style="margin:8px 2px 0">没有会话可回时（定时、流水线开的工单）发到：${esc(sourceTitle(home.source))} <span class="mono">${esc((home.address || {}).chat || '')}</span>。
    在这里改的存在库里，叠在 local.yaml 上，记进下面的变更历史；切换渠道后宿主会自动重启（约 15 秒）${c.restartable ? '' : '——现在不是 launchd 起的，切换后要手动重启'}。</div></section>`;
}

VIEWS.settings = (d) => {
  const st = S.settings, ov = S.ov || {};
  if (!st) return '<div class="empty">加载中…</div>';
  const modes = MODES.map(([m, desc]) => `<div class="mode${st.mode === m ? ' on' : ''}"><span class="name">${m}</span><span class="desc">${desc}</span>
    ${st.mode === m ? chip('当前', 'info') : `<button class="btn" data-act="mode" data-mode="${m}">切到 ${m}${m === 'auto' ? '…' : ''}</button>`}</div>`).join('');
  const keyName = (k) => { const [kind, id] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)]; return kind === 'rule' ? `规则「${ruleName(id)}」` : kind === 'agent' ? `Agent ${id}` : kind === 'origin' ? `事件来源 ${id}` : k; };
  const pausedKeys = Object.entries(st.paused_keys || {});
  const pausedList = pausedKeys.map(([k, v]) => `<div class="row"><div class="row-main"><div class="row-head"><b>${esc(keyName(k))}</b>${chip('已暂停', 'warn')}</div>${v && v.reason ? `<div class="row-sub">原因：${esc(v.reason)}</div>` : ''}
    <div class="actions"><button class="btn" data-act="resume-key" data-key="${esc(k)}">恢复</button></div></div><div class="row-meta">${T((v || {}).at)}</div></div>`).join('');

      <dt>机器名单</dt><dd>${who(part.bots)}</dd>
