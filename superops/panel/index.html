/* 需求与开发：需求池按“待评估 → 观察 → 批准 → PRD 评审 → 开发中 → 完成”流转；分数 = 信号 × 价值系数 ÷ 成本。
   人在这里做的决定：批准开发（= 周报卡片上的“按建议做”，开一张写 PRD → 开发的工单）、观察、搁置（写原因）、恢复；提新需求 */
const DEMAND_STAGES = [['open', '待评估', 'var(--c-blue)'], ['watching', '观察中', 'var(--c-yellow)'], ['approved', '已批准', 'var(--c-purple)'],
  ['prd_review', 'PRD 评审', 'var(--c-pink)'], ['in_dev', '开发中', 'var(--c-cyan)'], ['done', '已完成', 'var(--c-green)']];
const DEMAND_GROUPS = { all: (x) => x.status !== 'shelved', todo: (x) => ['open', 'watching'].includes(x.status || 'open'), doing: (x) => ['approved', 'prd_review', 'in_dev'].includes(x.status),
  done: (x) => x.status === 'done', shelved: (x) => x.status === 'shelved' };
const COST = { S: ['小', 'var(--c-green)'], M: ['中', 'var(--c-yellow)'], L: ['大', 'var(--c-orange)'] };
const SCORE_TIERS = [['hi', '高分 ≥2', (v) => v >= 2], ['mid', '中 1–2', (v) => v >= 1 && v < 2], ['lo', '低 <1', (v) => v < 1]];
function hbars(items, colors) {
  const max = Math.max(1, ...(items || []).map((i) => i.n || 0));
  return (items || []).map((i, k) => `<div class="hbar"><span class="hbar-l" title="${esc(bl(i.label))}">${esc(bl(i.label))}</span><span class="hbar-t"><i style="width:${Math.max(2, Math.round((i.n || 0) / max * 100))}%;--bc:${colors[k % colors.length]}"></i></span><b>${num(i.n)}</b></div>`).join('') || '<div class="faint">没有数据</div>';
}
/* 原话里的网址缩成“小红书 ↗”这样的小链接 */
const LINK_SITE = [[/xiaohongshu\.com|xhslink/, '小红书'], [/douyin\.com|iesdouyin/, '抖音'], [/channels\.weixin|weixin\.qq/, '视频号'], [/bilibili\.com|b23\.tv/, 'B站'], [/kuaishou\.com/, '快手'], [/zhihu\.com/, '知乎']];
function quoteHtml(text) {
  return esc(text).replace(/[(（]?\s*(https?:\/\/[^\s)）」"<，,；;]+)\s*[)）]?/g, (m, url) => {
    const site = (LINK_SITE.find(([re]) => re.test(url)) || [null, '链接'])[1];
    return `<a class="qlink" href="${url}" target="_blank" rel="noopener" title="${url}">${site} ↗</a>`;
  }).replace(/…$/, '<span class="faint">…</span>');
}
function demandPage(d, r, days) {

  const g = DEMAND_GROUPS[r.q.ds] ? r.q.ds : 'all';

  const doing = (count.approved || 0) + (count.prd_review || 0) + (count.in_dev || 0);

  const kpis = `<div class="kpis">${[

    kpi(num(sg.total), '需求信号', 'var(--c-yellow)'),

  const flow = `<div class="dflow">${DEMAND_STAGES.map(([k, label, c], i) => `<div class="dflow-s${count[k] ? '' : ' zero'}" style="--fc:${c}">
      <b>${num(count[k] || 0)}</b><span>${label}</span></div>${i < DEMAND_STAGES.length - 1 ? '<i class="dflow-a">›</i>' : ''}`).join('')}
    ${count.shelved ? `<i class="dflow-a">·</i><div class="dflow-s" style="--fc:var(--faint)"><b>${num(count.shelved)}</b><span>已搁置</span></div>` : ''}</div>`;

  /* 优先级矩阵：还没批的需求，按分数 × 成本放格子；高分又便宜的先做 */

      <div class="dm-main">
        <div class="dm-title">${x.is_test ? '<span class="tag line">测试</span> ' : ''}${esc(String(x.title || '').replace(/^【测试】/, ''))}</div>

      <div class="dplat-m"><span>互动 <b>${num(e)}</b></span><span>互动率 <b>${pctx(v ? e / v : null)}</b></span>${comp.length ? `<span>完播 <b>${pctx(sum(comp, (x) => x.completion_rate) / comp.length)}</b></span>` : ''}<span>涨粉 <b>${num(sum(xs, (x) => x.follows_gained))}</b></span></div>
      ${best ? `<div class="dplat-best" title="${esc(best.title || '')}">最好：${esc(best.title || best.id)}</div>` : ''}</div>`;
  }).join('')}</div></section>` : '';

  /* 作品：同一条内容在各平台的作品放一组对比 */
  const groups = [];
  live.forEach((x) => { const key = x.content_id || x.id; let g = groups.find((y) => y.key === key); if (!g) groups.push(g = { key, items: [] }); g.items.push(x); });
  const card = (x) => {
    const pc = PLATFORM_COLOR[x.platform] || 'var(--c-cyan)', ser = x.series || [], prev = ser.length > 1 ? ser[ser.length - 2] : null;
    const delta = prev && x.views != null && prev.views != null ? Number(x.views) - Number(prev.views) : null;
    const at = (k) => ser.filter((s) => s.checkpoint === k).slice(-1)[0];
    const track = CKPTS.map(([k, label]) => {
      const jb = (x.jobs || []).find((y) => y.checkpoint === k), snap = at(k), [stl, sc] = JOB_LOOK[jb ? jb.state : 'pending'] || ['', 'var(--faint)'];
      const val = snap ? num(snap.views) : jb && jb.state === 'pending' ? `<span class="faint">${((dd) => (dd ? `${pad(dd.getMonth() + 1)}-${pad(dd.getDate())}` : '—'))(parseTime(jb.due_at))}</span>` : jb ? `<span style="color:${sc}">${esc(stl)}</span>` : '<span class="faint">—</span>';
      const tip = jb ? `${label}：${stl}${jb.due_at ? `，到点 ${shortTime(parseTime(jb.due_at))}` : ''}${jb.attempts ? `，试了 ${jb.attempts} 次` : ''}${jb.error ? `\n${jb.error}` : ''}` : `${label}：没有这个节点`;
      return `<div class="ck ck-${jb ? jb.state : 'none'}" style="--sc:${sc}" title="${esc(tip)}"><i></i><span>${label}</span><b>${val}</b></div>`;
    }).join('');
    /* 只提示还没被后面成功的采集盖过去的错误（比如 1 小时节点登录失效跳过、24 小时节点已经采上，就不再提示） */
    const lastDone = (x.jobs || []).filter((y) => y.state === 'done').map((y) => y.due_at || '').sort().pop() || '';
    const err = (x.jobs || []).filter((y) => y.error && y.state !== 'done' && (y.due_at || '') > lastDone).slice(-1)[0];
    return `<article class="dpost" style="--pc:${pc}">
      <div class="dpost-h"><span class="plat-tag" style="--pc:${pc}">${esc(bl(x.platform))}</span><span class="faint">${x.publish_mode === 'auto' ? '自动发布' : x.publish_mode ? '人工发布' : ''}</span>
        <button class="btn small" style="margin-left:auto" data-act="collect-post" data-id="${esc(x.id)}" data-title="${esc(x.title || x.id)}">采一次</button></div>
      <div class="dpost-t">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.id)} ↗</a>` : esc(x.title || x.id)}</div>
      <div class="dpost-sub">发布于 ${T(x.published_at)}${x.captured_at ? ` · 最近一次 ${T(x.captured_at)}（${esc(CK_LABEL[x.checkpoint] || x.checkpoint)}）` : ' · 还没采到'}</div>
      <div class="dpost-m"><div class="dpost-v"><b>${num(x.views)}</b><small>播放${delta ? ` <em class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${num(delta)}</em>` : ''}</small></div>
        <div class="dpost-g">${ENGAGE.map(([k, l]) => `<span><small>${l}</small><b>${num(x[k])}</b></span>`).join('')}<span><small>涨粉</small><b>${num(x.follows_gained)}</b></span>
          ${x.completion_rate != null ? `<span><small>完播</small><b>${pctx(x.completion_rate)}</b></span>` : ''}${x.avg_watch_sec != null ? `<span><small>均看</small><b>${Math.round(x.avg_watch_sec)}s</b></span>` : ''}</div></div>
      ${spark(ser, pc)}
      <div class="cks">${track}</div>
      ${err ? `<div class="pnote warn" title="${esc(err.error)}">${esc(CK_LABEL[err.checkpoint] || err.checkpoint)}：${esc(err.error)}</div>` : ''}
      ${x.comments_collected ? `<div class="faint dpost-c">采到评论 ${num(x.comments_collected)} 条</div>` : ''}
    </article>`;
  };
  const group = (g) => {
    const v = sum(g.items, (x) => x.views), first = g.items[0];
    const share = v ? `<div class="dshare" title="各平台播放占比">${g.items.map((x) => `<i style="flex:${Number(x.views) || 0};--pc:${PLATFORM_COLOR[x.platform] || 'var(--c-cyan)'}" title="${esc(bl(x.platform))} ${num(x.views)}"></i>`).join('')}</div>` : '';
    return `<section class="pgroup"><div class="pgroup-h"><div><div class="eyebrow">${esc(g.key)}${g.items.length > 1 ? ` · ${g.items.length} 个平台` : ''}</div><div class="pgroup-t">${esc(first.title || g.key)}</div></div>
      <div class="dgroup-v"><b>${num(v)}</b><small>播放合计</small>${share}</div></div><div class="dposts">${g.items.map(card).join('')}</div></section>`;
  };
  const postsHtml = `<section class="sec"><h2>作品 <span class="cnt">${live.length}</span><span class="hint">同一条内容的各平台作品放一组；小圆点是四个采集节点，下面的数字是那次采到的播放，鼠标放上去看详情</span></h2>
    ${groups.length ? groups.map(group).join('') : '<div class="quiet">还没有作品。发布登记后会自动排上采集节点</div>'}
    ${gone.length ? fold('data-gone', `已删除的作品 <span class="cnt">${gone.length}</span><span class="hint">标记删除后不再采集，保留最后一次的数</span>`,
      `<div class="list">${table([{ h: '平台', f: (x) => `<span class="plat-tag" style="--pc:${PLATFORM_COLOR[x.platform] || 'var(--c-cyan)'}">${esc(bl(x.platform))}</span>` }, { h: '标题', c: 'wide', f: (x) => esc(x.title || x.id) },
        { h: '发布', f: (x) => T(x.published_at) }, { h: '删除', f: (x) => T(x.removed_at) }, { h: '播放', c: 'num', f: (x) => num(x.views) }, { h: '互动', c: 'num', f: (x) => num(engageOf(x)) }], gone)}</div>`, false, true) : ''}</section>`;

  /* 接下来要采的 */
  const up = d.upcoming_jobs || [], now = Date.now();
  const upHtml = `<section class="sec"><h2>接下来要采的 <span class="cnt">${up.length}</span></h2>${up.length ? `<div class="list">${up.map((x) => {
    const due = parseTime(x.due_at), late = due && due.getTime() < now;
    return `<div class="dup${late ? ' late' : ''}"><span class="dup-when">${due ? (late ? `逾期 ${relTime(due).replace('前', '')}` : relTime(due)) : '—'}</span>
      <span class="plat-tag" style="--pc:${PLATFORM_COLOR[x.platform] || 'var(--c-cyan)'}">${esc(bl(x.platform))}</span><span class="mchip" style="--mc:${late ? 'var(--bad)' : 'var(--c-blue)'}">${esc(CK_LABEL[x.checkpoint] || x.checkpoint)}</span>
      <span class="dup-t">${esc(x.title || x.post_id)}</span><span class="dup-m">${T(x.due_at)}${x.attempts ? ` · 试了 ${x.attempts} 次` : ''}</span>
      ${x.last_error ? `<div class="dup-e">${esc(x.last_error)}</div>` : ''}</div>`;
  }).join('')}</div>` : '<div class="quiet">没有待采的节点</div>'}</section>`;

  /* 评论 */
  const rc = d.recent_comments || [];
  const comHtml = `<section class="sec"><h2>评论 <span class="cnt">${num(cm.total)}</span><span class="hint">作品下采到的评论，分拣后进需求信号和回复草稿</span></h2>
    ${cm.total ? `<div class="dgrid3"><div class="panel"><div class="ptitle-s">分类</div>${hbars(cm.category, ['var(--c-cyan)', 'var(--c-orange)', 'var(--c-purple)', 'var(--c-green)', 'var(--c-pink)', 'var(--c-yellow)'])}</div>
      <div class="panel"><div class="ptitle-s">情绪</div>${hbars(cm.sentiment, ['var(--c-green)', 'var(--c-blue)', 'var(--c-orange)', 'var(--c-yellow)'])}</div>
      <div class="panel"><div class="ptitle-s">回复</div>${hbars(cm.reply, ['var(--c-yellow)', 'var(--c-green)', 'var(--c-blue)', 'var(--c-purple)'])}</div></div>
      ${rc.length ? `<div class="list sigs" style="margin-top:12px">${rc.map((c) => `<div class="sig"><div class="sig-dot" style="--ic:${PLATFORM_COLOR[c.platform] || 'var(--c-cyan)'}"></div><div class="sig-main"><div class="sig-q">${esc(c.text)}</div>
        <div class="sig-meta">${T(c.at)}<span>${esc(bl(c.platform))}</span>${c.category ? `<span>${esc(bl(c.category))}</span>` : ''}${c.sentiment ? `<span>${esc(bl(c.sentiment))}</span>` : ''}${c.likes ? `<span>赞 ${num(c.likes)}</span>` : ''}${c.reply_status ? `<span>${esc(bl(c.reply_status))}</span>` : ''}</div>
        <div class="sig-to">→ ${esc(c.title || c.post_id || '')}</div></div></div>`).join('')}</div>` : ''}`
      : '<div class="quiet">还没采到评论</div>'}</section>`;
  return `${head}${platHtml}${postsHtml}${upHtml}${comHtml}`;
}

/* 获客：线索（社媒监听找到的潜在用户）和监听用的意图词 */
const PLATFORM_COLOR = { douyin: '#25f4ee', xiaohongshu: '#ff2e4d', channels: '#fa9d3b', wechat_channels: '#fa9d3b', kuaishou: '#ff6a1a', bilibili: '#fb7299', zhihu: '#3d8bff', wechat_oa: '#07c160' };
const COMMENT_STATE = { sent: ['评论已发出', 'ok'], unconfirmed: ['发了但没确认到', 'warn'], manual: ['要人去发', 'hot'] };
const STAGE_COLOR = { 待跟进: 'var(--c-orange)', 已评论: 'var(--c-cyan)', 已联系: 'var(--c-blue)', 已回复: 'var(--c-green)', 粉丝不足: 'var(--c-yellow)', 不跟进: 'var(--faint)' };
const TERM_COLOR = { pain: 'var(--c-orange)', solution: 'var(--c-cyan)', competitor: 'var(--c-pink)', brand: 'var(--c-green)', persona: 'var(--c-purple)' };
function fans(n) { n = Number(n); if (!isFinite(n) || n <= 0) return '—'; return n >= 10000 ? `${+(n / 10000).toFixed(n >= 100000 ? 0 : 1)}万` : num(n); }
function growthPage(g, r, days) {
  const all = g.leads || [], terms = g.terms || [], fn = g.funnel || {};
  const plats = [...new Set(all.map((x) => x.platform))];
  const lp = plats.includes(r.q.lp) ? r.q.lp : '';
  const leads = lp ? all.filter((x) => x.platform === lp) : all;
  const ARCHIVE = ['不跟进', '粉丝不足'];
  const isManual = (x) => x.comment_text && (x.comment_status === 'manual' || x.comment_status === 'unconfirmed');
  const todo = all.filter((x) => x.stage === '待跟进');
  const sent = all.filter((x) => x.comment_status === 'sent').length;
  const activeTerms = terms.filter((t) => t.active), hits = activeTerms.reduce((a, t) => a + (t.hits_7d || 0), 0);
  const kpi = (v, label, color, hot) => `<div class="kpi${hot ? ' hot' : ''}" style="--kc:${color}"><b>${v}</b><small>${label}</small></div>`;
  const kpis = `<div class="kpis">${[
    kpi(num(g.total), '线索', 'var(--c-cyan)'),
    kpi(num(todo.length), `待跟进${all.filter(isManual).length ? ` · ${all.filter(isManual).length} 条评论要你发` : ''}`, 'var(--c-orange)', todo.length > 0),
    kpi(num(sent), '评论已发出', 'var(--c-green)'),
    kpi(num(fn.contacted || 0), `已联系 · 回复 ${num(fn.replied || 0)}`, 'var(--c-blue)'),
    kpi(num(activeTerms.length), `在用意图词 / 共 ${terms.length}`, 'var(--c-purple)'),
    kpi(num(hits), '意图词近 7 天命中', 'var(--c-pink)'),
  ].join('')}</div>`;

  /* 监听漏斗：采到的作品 → 线索 → 上卡片 → 评论发出 → 已联系 → 已回复，每一步写转化率 */
  const steps = [['监听到作品 · 7 天', fn.mentions_7d, 'var(--c-blue)', (fn.mention_platforms || []).map((x) => `${bl(x.label)} ${num(x.n)}`).join(' · ')],
    ['判成线索', fn.leads, 'var(--c-cyan)'], ['上过线索卡片', fn.carded, 'var(--c-purple)', '粉丝不足的不上卡'],
    ['评论发出', fn.commented, 'var(--c-green)'], ['已联系', fn.contacted, 'var(--c-orange)'], ['已回复', fn.replied, 'var(--c-pink)']];
  const rate = (a, b) => (b ? `${Math.round(a / b * 100)}%` : '—');
  const funnel = `<div class="dflow gfun">${steps.map(([label, n, c, tip], i) => `<div class="dflow-s${n ? '' : ' zero'}" style="--fc:${c}"${tip ? ` title="${esc(tip)}"` : ''}>
      <b>${num(n || 0)}</b><span>${label}</span>${i ? `<em>上一步的 ${rate(n || 0, steps[i - 1][1])}</em>` : `<em>${esc(tip || '')}</em>`}</div>${i < steps.length - 1 ? '<i class="dflow-a">›</i>' : ''}`).join('')}</div>`;

  /* 看板：按跟进阶段分栏；不跟进 / 粉丝不足归档到下面 */
  const COLS = [['卡片待批', (x) => ['发现', '已发卡'].includes(x.stage || '发现'), 'var(--c-purple)', '在今日线索卡片上，等你回答'],
    ['待跟进', (x) => x.stage === '待跟进', 'var(--c-orange)', '你批了要跟进的：评论要你发的先发，私信了点“已联系”'],
    ['已评论', (x) => x.stage === '已评论', 'var(--c-cyan)', '品牌号已在作品下评论，等对方回应'],
    ['已联系', (x) => x.stage === '已联系', 'var(--c-blue)', '已经私信或加了联系方式'],
    ['已回复', (x) => x.stage === '已回复', 'var(--c-green)', '对方回应了：转人工深聊']];
  const cols = COLS.filter(([label, f]) => label !== '卡片待批' || leads.some(f));
  const act = (x, stage, label, primary) => `<button class="btn small${primary ? ' primary' : ''}" data-act="lead-stage" data-id="${esc(x.id)}" data-stage="${stage}" data-name="${esc(x.nickname || x.id)}">${label}</button>`;
  const card = (x) => {
    const pc = PLATFORM_COLOR[x.platform] || 'var(--c-cyan)', sc = Number(x.score) || 0;
    const [cs, ct] = COMMENT_STATE[x.comment_status] || [x.comment_text ? '评论还没发' : '', ''];
    const name = x.profile_url ? `<a href="${esc(x.profile_url)}" target="_blank" rel="noopener" title="打开主页">${esc(x.nickname || x.id)}</a>` : esc(x.nickname || x.id);
    const acts = [], toSend = isManual(x) || (x.stage === '待跟进' && x.comment_text && x.comment_status !== 'sent');
    if (toSend) {
      acts.push(`<button class="btn small" data-act="copy" data-copy="${esc(x.comment_text)}">复制评论</button>`);
      if (x.target_url) acts.push(`<a class="btn small" href="${esc(x.target_url)}" target="_blank" rel="noopener">去原帖 ↗</a>`);
      acts.push(`<button class="btn small primary" data-act="lead-commented" data-id="${esc(x.id)}" data-name="${esc(x.nickname || x.id)}">我已发评论</button>`);
    }
    if (x.stage === '待跟进') acts.push(act(x, '已联系', '已联系'));
    if (x.stage === '已评论') acts.push(act(x, '已回复', '对方回复了', true), act(x, '已联系', '已联系'));
    if (x.stage === '已联系') acts.push(act(x, '已回复', '对方回复了', true));
    if (['待跟进', '已评论', '已联系', '已回复'].includes(x.stage)) acts.push(`<button class="btn small ghost" data-act="lead-skip" data-id="${esc(x.id)}" data-name="${esc(x.nickname || x.id)}">不跟进…</button>`);
    return `<article class="lead kl${isManual(x) ? ' hot' : ''}" style="--pc:${pc}">
      <div class="lead-h"><span class="lead-ava">${esc(Array.from(String(x.nickname || '?'))[0])}</span>
        <div class="lead-id"><div class="lead-n">${name}</div><div class="lead-sub"><span class="plat">${esc(bl(x.platform))}</span>${x.industry ? `<span>${esc(x.industry)}</span>` : ''}<span>${esc(bl(x.lead_type))}</span><span>粉丝 <b>${fans(x.followers)}</b></span></div></div>
        <div class="lead-score ${sc >= 80 ? 'hi' : sc >= 60 ? 'mid' : 'lo'}" title="线索分"><b>${num(Math.round(sc))}</b></div></div>
      ${x.why ? `<div class="lead-why kl-why" title="${esc(x.why)}">${esc(x.why)}</div>` : ''}
      ${x.comment_text ? `<div class="bubble${ct ? ' ' + ct : ''}"><div class="bubble-h"><span>${esc(cs)}</span>${x.commented_at ? `<span class="mono">${T(x.commented_at)}</span>` : ''}${x.target_url && !toSend ? `<a href="${esc(x.target_url)}" target="_blank" rel="noopener">看原帖 ↗</a>` : ''}</div>
        <div class="bubble-t">${esc(x.comment_text)}</div>${x.comment_note && x.comment_status !== 'sent' ? `<div class="bubble-n">${esc(x.comment_note)}</div>` : ''}</div>`
        : x.comment_status === 'manual' ? `<div class="pnote hot">要你去互动：${esc(x.comment_note || '还没有拟好的评论')}</div>` : ''}
      ${x.outreach_draft ? `<details class="inline" data-k="lead:${esc(x.id)}"${S.ui.open['lead:' + x.id] ? ' open' : ''}><summary>跟进建议</summary><div class="lead-why">${esc(x.outreach_draft)}</div></details>` : ''}
      ${acts.length ? `<div class="kl-acts">${acts.join('')}</div>` : ''}
      <div class="kl-t">${T(x.updated_at)}</div>
    </article>`;
  };
  const platChips = plats.length > 1 ? `<div class="filters">${[['', '全部平台', all.length], ...plats.map((p) => [p, bl(p), all.filter((x) => x.platform === p).length])]
    .map(([k, label, n]) => `<a class="fchip${k === lp ? ' on' : ''}" href="${H('business', { tab: 'growth', days, lp: k })}">${esc(label)}<b class="num">${n}</b></a>`).join('')}</div>` : '';
  const board = `<section class="sec"><h2>跟进看板 <span class="cnt">${leads.filter((x) => !ARCHIVE.includes(x.stage)).length}</span><span class="hint">按跟进阶段分栏，栏里按分数排；你自己发了评论、私信了、对方回了，在卡片上点一下，阶段就往右挪。只改记录，不会对外发任何东西</span></h2>
    ${platChips}<div class="kb" style="--cols:${cols.length}">${cols.map(([label, f, c, tip]) => {
      const xs = leads.filter(f);
      return `<div class="kb-col" style="--kc:${c}"><div class="kb-h" title="${esc(tip)}"><i></i>${label}<b>${xs.length}</b></div><div class="kb-tip">${esc(tip)}</div>
        ${xs.map(card).join('') || '<div class="kb-empty">—</div>'}</div>`;
    }).join('')}</div></section>`;
  const archived = leads.filter((x) => ARCHIVE.includes(x.stage));
  const archHtml = archived.length ? fold('lead-archive', `不跟进 / 粉丝不足 <span class="cnt">${archived.length}</span><span class="hint">你选了不跟进的，和粉丝数不够、没上卡片的；想跟进可以拉回“待跟进”</span>`,
    `<div class="list">${archived.map((x) => `<div class="row"><div class="row-main"><div class="row-head"><span class="plat-tag" style="--pc:${PLATFORM_COLOR[x.platform] || 'var(--c-cyan)'}">${esc(bl(x.platform))}</span>
      <b>${x.profile_url ? `<a href="${esc(x.profile_url)}" target="_blank" rel="noopener">${esc(x.nickname || x.id)}</a>` : esc(x.nickname || x.id)}</b><span class="stg" style="--sc:${STAGE_COLOR[x.stage]}">${esc(x.stage)}</span>
      <span class="faint">${esc(x.industry || '')} · 粉丝 ${fans(x.followers)} · ${num(Math.round(Number(x.score) || 0))} 分</span></div>
      ${x.why ? `<div class="row-sub clamp">${esc(x.why)}</div>` : ''}</div>
      <div class="row-meta">${act(x, '待跟进', '拉回待跟进')}</div></div>`).join('')}</div>`, false, true) : '';

  const dists = `<div class="dgrid3"><div class="panel"><div class="ptitle-s">平台</div>${hbars(g.platforms, (g.platforms || []).map((x) => PLATFORM_COLOR[x.label] || 'var(--c-cyan)'))}</div>
    <div class="panel"><div class="ptitle-s">类型</div>${hbars(g.types, ['var(--c-cyan)', 'var(--c-purple)', 'var(--c-orange)', 'var(--c-green)'])}</div>
    <div class="panel"><div class="ptitle-s">行业</div>${hbars((g.industries || []).slice(0, 6), ['var(--c-blue)', 'var(--c-pink)', 'var(--c-yellow)', 'var(--c-green)', 'var(--c-purple)', 'var(--c-cyan)'])}</div></div>`;

  });

}

function render(force) {

  if ((typing || S.dragging) && !force) { S.dirty = true; return; }   /* 人在输入或拖卡片时不换 DOM，结束后再补 */
  S.dirty = false;
  let html;

  else {

  }
  if (view._html === html) return;
  const active = document.activeElement, fk = active && view.contains(active) ? active.dataset.fk : null;
  let range = null;
  if (fk) { try { range = [active.selectionStart, active.selectionEnd]; } catch (e) { /* 有的输入框没有选区 */ } }
  view.innerHTML = html; view._html = html;
  const focus = fk || (S.ui.form && S.ui.form.fresh ? `form:${S.ui.form.t}:${S.ui.form.kind}` : null);
  if (focus) {
    const el = view.querySelector(`[data-fk="${focus}"]`);
    if (el) { el.focus({ preventScroll: !S.ui.form || !S.ui.form.fresh }); if (range) { try { el.setSelectionRange(range[0], range[1]); } catch (e) { /* 同上 */ } } }

}
function toast(message, tone) {

function ask({ title, body, ok, danger, input, select }) {

      ${select ? `<label class="dlg-input">${esc(select.label)}<select class="inp" name="choice">${select.options.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label>` : ''}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement('textarea');   /* 内网 http 页面没有剪贴板 API 时的退路 */
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
  }
  toast('已复制');
}

/* ───────────────────────── 人的操作 ───────────────────────── */
async function act(button, work, done) {
  if (button) button.disabled = true;
  try {
    const result = await work();
    if (done) toast(typeof done === 'function' ? done(result) : done);
    return result;
  } catch (e) {
    toast(e.message || '操作没有成功', 'bad');
    return null;
  } finally {
    if (button) button.disabled = false;
    S.settingsAt = 0;
    await load();
    setTimeout(load, 1500);   /* 操作引出的后续（执行器跑一轮、发消息）稍后才落库 */
  }
}
function openForm(form) { S.ui.form = Object.assign({ text: '', fresh: true }, form); render(true); }
function closeForm() { S.ui.form = null; render(true); }
async function submitForm(button) {
  const f = S.ui.form;
  if (!f) return;
  const text = (f.text || '').trim();
  if (!text) { f.error = f.kind === 'pick' ? '填要批的明细序号，例如 3,5' : f.kind === 'reason' ? '要写原因' : '写点什么再发'; return render(true); }
  if (f.kind === 'pick' && !/^#?\d+(\s*[,，、\s]\s*#?\d+)*$/.test(text)) { f.error = '只填明细序号，用逗号隔开，例如 3,5'; return render(true); }
  button.disabled = true;
  try {
    if (f.kind === 'reply') { await post(`/api/tickets/${encodeURIComponent(f.t)}/reply`, { text }); toast(`已交给 ${f.t} 的执行器`); }
    else { await post(`/api/tickets/${encodeURIComponent(f.t)}/answer`, { choice: f.o, reason: text }); toast(f.kind === 'pick' ? `${f.t} 已回答「${f.label}」，只批第 ${text.match(/\d+/g).join('、')} 条` : `${f.t} 已回答「${f.label}」`); }
    S.ui.form = null;
  } catch (e) {
    f.error = e.message || '没有成功';
  }
  await load(); render(true);
  setTimeout(load, 1500);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el);
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.draft) { S.ui.drafts[e.target.dataset.draft] = e.target.value; return; }
  if (e.target.dataset.form === 'text' && S.ui.form) { S.ui.form.text = e.target.value; S.ui.form.error = null; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.target.isContentEditable && !$('#dlg').open && !$('#qrdlg').open) {
    e.preventDefault(); $('#search').focus(); return;
  }
  if (e.key === 'Enter' && !e.isComposing && e.target.closest && e.target.closest('.qr-sms')) { e.preventDefault(); ACTIONS['qr-code'](); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || e.target.tagName === 'INPUT') && e.target.dataset.form === 'text' && !e.isComposing) {
    const b = e.target.closest('.form').querySelector('[data-act="form-submit"]');
    if (b) { e.preventDefault(); submitForm(b); }
  }
});
/* 内容日历：把卡片拖到另一天就改计划日 */
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest && e.target.closest('.citem[data-cid]');
  if (!el) return;
  S.dragging = el.dataset.cid;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', el.dataset.cid);
});
document.addEventListener('dragover', (e) => {
  const day = S.dragging && e.target.closest && e.target.closest('.cday[data-day]');
  if (!day) return;
  e.preventDefault();
  document.querySelectorAll('.cday.drop-on').forEach((d) => d !== day && d.classList.remove('drop-on'));
  day.classList.add('drop-on');
});
document.addEventListener('drop', (e) => {
  const day = S.dragging && e.target.closest && e.target.closest('.cday[data-day]');
  if (!day) return;
  e.preventDefault();
  const id = S.dragging, from = (document.querySelector(`.citem[data-cid="${CSS.escape(id)}"]`) || {}).dataset || {};
  S.dragging = null;
  day.classList.remove('drop-on');
  if (day.dataset.day !== from.date) act(null, () => post('/api/contents', { action: 'move', id, date: day.dataset.day }), `已改到 ${day.dataset.day.slice(5)}`);
});
document.addEventListener('dragend', () => {
  S.dragging = null;
  document.querySelectorAll('.citem.dragging, .cday.drop-on').forEach((el) => el.classList.remove('dragging', 'drop-on'));
  if (S.dirty) render();
});
document.addEventListener('toggle', (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) S.ui.open[k] = e.target.open; }, true);
document.addEventListener('focusout', () => setTimeout(() => { if (S.dirty) render(); }, 0));

let searchTimer = null;
$('#search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(() => {
    const target = q.trim() ? H('search', { q }) : (S.route.view === 'search' ? '#/overview' : null);
    if (!target) return;
    if (S.route.view === 'search' && q.trim()) { history.replaceState(null, '', target); route(); } else location.hash = target;
  }, 300);
});

function route() {
  const next = parseHash();
  const changed = !S.route || S.route.key !== next.key, page = !S.route || S.route.view !== next.view || S.route.arg !== next.arg;
  S.route = next;
  if (changed) { S.ui.form = null; S.missing = null; }
  if (page) window.scrollTo(0, 0);
  render(true);
  load();
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5000);
function tick() { const d = new Date(); $('#clock').innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}<small>${['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()]}</small>`; }
